name: Validate accepted static installer

on:
  push:
    branches: [main]
    paths:
      - 'release.json'
      - 'releases/device-update.json'
      - 'build.py'
      - 'index.html'
      - 'app.js'
      - 'firmware/**'
      - 'scripts/validate_release.py'
      - '.github/workflows/release-main.yml'
  pull_request:
    branches: [main]
    paths:
      - 'release.json'
      - 'releases/device-update.json'
      - 'build.py'
      - 'index.html'
      - 'app.js'
      - 'firmware/**'
      - 'scripts/validate_release.py'
      - '.github/workflows/release-main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository release policy
        run: python3 scripts/validate_release.py
      - name: Validate installer and retained firmware assets
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python3 build.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          r = json.loads(Path('release.json').read_text())
          assert r['release'] == 'production-workshop-os-v11.19.1'
          assert r['board']['id'] == 'ws_lcd_350'
          assert set(r['profiles']) == {'workshop-os-v11.19.1', 'smart-home-v7.2'}
          assert r['profiles']['workshop-os-v11.19.1']['recommended'] is True
          assert r['profiles']['smart-home-v7.2']['recommended'] is False
          for pid, p in r['profiles'].items():
              for path_key, size_key, sha_key in [('file','size','sha256'), ('otaFile','otaSize','otaSha256')]:
                  raw = Path(p[path_key]).read_bytes()
                  assert len(raw) == p[size_key], (pid, path_key, len(raw), p[size_key])
                  assert hashlib.sha256(raw).hexdigest() == p[sha_key], (pid, path_key)
                  published = (Path('dist') / p[path_key]).read_bytes()
                  assert hashlib.sha256(published).hexdigest() == p[sha_key], (pid, path_key, 'dist')

          d = json.loads(Path('releases/device-update.json').read_text())
          assert d['schemaVersion'] == 1
          assert d['board'] == 'ws_lcd_350'
          assert d['authority'] == 'azmusgb/bambuhelper-smart-display'
          assert d['artifactBaseUrl'] == 'https://raw.githubusercontent.com/azmusgb/bambuhelper-smart-display/main/'
          stable = d['channels']['stable']
          assert stable['status'] == 'published'
          assert stable['release'] == r['release']
          static = r['profiles']['workshop-os-v11.19.1']
          assert stable['ota']['path'] == static['otaFile']
          assert stable['ota']['size'] == static['otaSize']
          assert stable['ota']['sha256'] == static['otaSha256']
          assert stable['fullFlash']['path'] == static['file']
          assert stable['fullFlash']['size'] == static['size']
          assert stable['fullFlash']['sha256'] == static['sha256']
          assert stable['fullFlash']['flashOffset'] == '0x0'
          assert stable['fullFlash']['deviceInstallAllowed'] is False
          for kind in ('ota', 'fullFlash'):
              meta = stable[kind]
              raw = Path(meta['path']).read_bytes()
              assert len(raw) == meta['size'], ('device-update', kind, 'size')
              assert hashlib.sha256(raw).hexdigest() == meta['sha256'], ('device-update', kind, 'sha256')
          candidate = d['channels']['candidate']
          assert candidate['status'] in {'none-published', 'published'}
          if candidate['status'] == 'published':
              assert candidate['ota'] is not None
              raw = Path(candidate['ota']['path']).read_bytes()
              assert len(raw) == candidate['ota']['size'], ('candidate', 'size')
              assert hashlib.sha256(raw).hexdigest() == candidate['ota']['sha256'], ('candidate', 'sha256')
          else:
              assert candidate['ota'] is None
          assert d['rules']['normalDeviceUpdateUsesOtaOnly'] is True
          assert d['rules']['verifySizeBeforeInstall'] is True
          assert d['rules']['verifySha256BeforeInstall'] is True
          assert d['rules']['fullFlashRequiresRecoveryFlow'] is True

          assert len(list(Path('firmware').glob('*.bin'))) == 4
          assert len(list((Path('dist') / 'firmware').glob('*.bin'))) == 4
          print('Accepted static installer + device update manifest integrity: PASS')
          PY
          grep -Fq "EXPECTED_RELEASE='production-workshop-os-v11.19.1'" app.js
          grep -Fq "selectedProfile='workshop-os-v11.19.1'" app.js
          grep -Fq 'Workshop OS v11.19.1 — recommended' index.html
          grep -Fq 'Smart Home v7.2 — rollback' index.html
          grep -Fq 'Workshop OS v11.19.1 OTA' index.html
          echo 'accepted Workshop OS v11.19.1 static portal contract: PASS'
