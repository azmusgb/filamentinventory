name: WorkshopCompanion
options:
  bundleIdPrefix: com.azmusgb
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
targets:
  WorkshopCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WorkshopCompanion
        excludes:
          - Info.plist
    info:
      path: WorkshopCompanion/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azmusgb.WorkshopCompanion
        PRODUCT_NAME: WorkshopCompanion
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    scheme:
      testTargets: []
