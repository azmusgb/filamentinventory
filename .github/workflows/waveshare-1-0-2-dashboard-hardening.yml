name: Apply Waveshare Home 1.0.2 Dashboard Hardening

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/harden_waveshare_dashboard_1_0_2.py'
      - '.github/workflows/waveshare-1-0-2-dashboard-hardening.yml'

permissions:
  contents: write
  actions: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply 1.0.2 dashboard hardening
        run: python3 tools/harden_waveshare_dashboard_1_0_2.py

      - name: Validate dashboard source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('firmware/waveshare-home/WaveshareHome/Services.cpp').read_text()
          m = Path('firmware/waveshare-home/WaveshareHome/AppModel.h').read_text()
          assert 'FW_VERSION[] = "1.0.2"' in m
          assert s.count('#include <esp_heap_caps.h>') == 1
          assert 'doc["ota"]["total"]' in s
          assert 'doc["ota"]["percent"]' in s
          assert 'scheduleSync' in s
          start = s.index("<form method='post' action='/settings'>")
          end = s.index('</form>', start)
          assert s[start:end].count('<form') == 1, 'nested form remains inside settings'
          print('Dashboard invariants validated')
          PY

      - name: Commit firmware changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome/Services.cpp firmware/waveshare-home/WaveshareHome/AppModel.h
          git commit -m 'Harden Waveshare Home dashboard for 1.0.2'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger firmware build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml -f version=1.0.2 || gh workflow run waveshare-home.yml
