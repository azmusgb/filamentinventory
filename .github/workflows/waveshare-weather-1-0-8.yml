name: Complete Waveshare Home Weather 1.0.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/waveshare-weather-1-0-8.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: waveshare-weather-1-0-8
  cancel-in-progress: false

jobs:
  patch:
    name: Patch weather and launch firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Apply weather hardening
        run: python3 tools/apply_waveshare_weather_1_0_8.py

      - name: Verify intended weather changes
        run: |
          set -euo pipefail
          grep -F 'FW_VERSION[] = "1.0.8"' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -F 'humidityPercent' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -F 'resolveLocationNow' firmware/waveshare-home/WaveshareHome/Services.h
          grep -F 'Location resolved; refreshing weather' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -F 'Open-Meteo HTTP' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -F 'Rain %d%% • RH %.0f%% • Wind %.0f mph' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino

      - name: Commit firmware changes
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            firmware/waveshare-home/WaveshareHome/AppModel.h \
            firmware/waveshare-home/WaveshareHome/Services.h \
            firmware/waveshare-home/WaveshareHome/Services.cpp \
            firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No firmware changes required.'
          else
            git commit -m 'Complete Waveshare Home weather in 1.0.8'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Launch validated firmware build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run waveshare-home.yml --repo "${{ github.repository }}" --ref main
          echo 'Triggered Build Waveshare Home Firmware for 1.0.8.'
