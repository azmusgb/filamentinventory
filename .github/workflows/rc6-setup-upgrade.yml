name: Apply rc6 Setup Upgrade

on:
  push:
    paths:
      - 'tools/rc6_setup_upgrade.py'
      - '.github/workflows/rc6-setup-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply rc6 migration
        run: python3 tools/rc6_setup_upgrade.py

      - name: Review changes
        run: git diff --check && git diff --stat

      - name: Commit rc6 firmware changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/waveshare-home/WaveshareHome/AppModel.h \
                  firmware/waveshare-home/WaveshareHome/Services.h \
                  firmware/waveshare-home/WaveshareHome/Services.cpp
          if git diff --cached --quiet; then
            echo "No firmware changes to commit"
            exit 0
          fi
          git commit -m "Improve Bambu discovery and weather setup for rc6"
          git push
