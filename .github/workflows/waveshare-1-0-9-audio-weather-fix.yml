name: Apply Waveshare Home 1.0.9 Audio + Weather Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/waveshare-1-0-9-audio-weather-fix.yml'
      - 'tools/apply_waveshare_1_0_9_audio_weather_fix.py'

permissions:
  contents: write
  actions: write

jobs:
  patch-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Apply 1.0.9 audio and weather patch
        run: python3 tools/apply_waveshare_1_0_9_audio_weather_fix.py

      - name: Validate patch markers
        run: |
          grep -q 'FW_VERSION\[\] = "1.0.9"' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -q 'extern TCA9554 ioExpander' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'Speaker test played: two-tone' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'String body = http.getString()' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'Open-Meteo:' firmware/waveshare-home/WaveshareHome/Services.cpp

      - name: Commit source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome/AppModel.h firmware/waveshare-home/WaveshareHome/Services.cpp
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'Fix Waveshare speaker and weather JSON in 1.0.9'
            git push origin HEAD:main
          fi

      - name: Dispatch firmware build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run waveshare-home.yml --repo '${{ github.repository }}' --ref main
          sleep 8
          RUN_ID=$(gh run list --repo '${{ github.repository }}' --workflow waveshare-home.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          echo "BUILD_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Build run: $RUN_ID"

      - name: Wait for validated firmware build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS=$(gh run view "$BUILD_RUN_ID" --repo '${{ github.repository }}' --json status,conclusion --jq '.status + ":" + (.conclusion // "")')
            echo "$STATUS"
            if [[ "$STATUS" == completed:success ]]; then exit 0; fi
            if [[ "$STATUS" == completed:* ]]; then exit 1; fi
            sleep 10
          done
          echo 'Timed out waiting for firmware build.' >&2
          exit 1

      - name: Verify 1.0.9 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(gh api "repos/${{ github.repository }}/actions/runs/$BUILD_RUN_ID/artifacts" --jq '.artifacts[0].name')
          echo "Artifact: $NAME"
          test "$NAME" = 'WaveshareHome-ESP32S3-1.0.9-fullflash'

      - name: Dispatch release publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run waveshare-release.yml --repo '${{ github.repository }}' --ref main
          echo 'Dispatched release publisher for latest validated 1.0.9 build.'
