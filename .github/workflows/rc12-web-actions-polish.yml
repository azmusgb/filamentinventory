name: Apply rc12 Web Actions Polish

on:
  push:
    branches: [main]
    paths:
      - tools/rc12_web_actions_polish.py
      - .github/workflows/rc12-web-actions-polish.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply rc12 web actions polish
        run: python tools/rc12_web_actions_polish.py

      - name: Review generated changes
        run: |
          git diff --check
          grep -q 'FW_VERSION\[\] = "1.0.0-rc12"' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -q 'Always return to the rich dashboard' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'consoleToast' firmware/waveshare-home/WaveshareHome/Services.cpp

      - name: Commit rc12 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome/Services.cpp
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'Polish rich web update actions for rc12'
            git push
          fi

      - name: Trigger firmware validation build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run waveshare-home.yml --ref main
