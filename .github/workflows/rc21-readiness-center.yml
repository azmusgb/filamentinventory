name: Apply rc21 Readiness Center

on:
  push:
    paths:
      - 'tools/rc21_readiness_center.py'
      - '.github/workflows/rc21-readiness-center.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply rc21 evolution
        run: python3 tools/rc21_readiness_center.py
      - name: Validate evolution
        run: |
          grep -q '1.0.0-rc21' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -q 'screenReadiness' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'refreshReadiness' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'SETUP READINESS' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
      - name: Commit rc21 firmware
        run: |
          if git diff --quiet; then
            echo 'No firmware changes needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add firmware/waveshare-home/WaveshareHome/AppModel.h firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
            git commit -m 'Add guided readiness center for rc21'
            git push
          fi
      - name: Trigger validated firmware build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml --repo '${{ github.repository }}'
