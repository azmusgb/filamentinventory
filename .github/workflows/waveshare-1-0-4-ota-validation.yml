name: Prepare Waveshare Home 1.0.4 OTA Validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/waveshare-1-0-4-ota-validation.yml'

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump firmware to 1.0.4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('firmware/waveshare-home/WaveshareHome/AppModel.h')
          s = p.read_text()
          old = 'static constexpr char FW_VERSION[] = "1.0.3";'
          new = 'static constexpr char FW_VERSION[] = "1.0.4";'
          if old not in s:
              if new in s:
                  print('Already at 1.0.4')
                  raise SystemExit(0)
              raise SystemExit('Expected 1.0.3 version marker not found')
          p.write_text(s.replace(old, new, 1))
          print('Prepared 1.0.4 OTA validation build')
          PY

      - name: Validate updater fix remains present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('firmware/waveshare-home/WaveshareHome/Services.cpp').read_text()
          m = Path('firmware/waveshare-home/WaveshareHome/AppModel.h').read_text()
          assert 'FW_VERSION[] = "1.0.4"' in m
          assert 'setFollowRedirects' in s, 'redirect following missing'
          assert 'Firmware size differs from manifest' in s
          print('1.0.4 invariants validated')
          PY

      - name: Commit firmware version
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome/AppModel.h
          git commit -m 'Prepare Waveshare Home 1.0.4 OTA validation'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger firmware build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml
