name: Fix Workshop Migration

on:
  push:
    paths:
      - '.github/workflows/fix-workshop-migration.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update migration version anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/workshop_upgrade.py')
          s = p.read_text()
          old = 'r(app, \'static constexpr char FW_VERSION[] = "1.0.0-rc2";\', \'static constexpr char FW_VERSION[] = "1.0.0-rc4";\')'
          new = 'r(app, \'static constexpr char FW_VERSION[] = "1.0.0-rc3";\', \'static constexpr char FW_VERSION[] = "1.0.0-rc4";\')'
          if old not in s:
              raise SystemExit('Expected rc2 migration anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/workshop_upgrade.py
          git commit -m "Fix workshop migration version anchor"
          git push
