name: Fix Workshop Migration

on:
  push:
    paths:
      - '.github/workflows/fix-workshop-migration.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Quote Python shell declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/workshop-platform-upgrade.yml')
          s = p.read_text()
          old = '        shell: python {0}'
          new = '        shell: "python {0}"'
          if old not in s:
              raise SystemExit('Expected shell declaration not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/workshop-platform-upgrade.yml
          git commit -m "Fix workshop migration workflow syntax"
          git push
