name: BambuHelper ws_lcd_350 smart profiles v3 validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bambuhelper-smart-profiles-v3-validation.yml'
      - '.bambuhelper-validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Patch, profile, and build ws_lcd_350 v3
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4

      - name: Checkout pinned BambuHelper source
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rehydrate evolution patchers
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/azmusgb/filamentinventory/741a6f0651fb4e20d8e2674f2c0ce726b0d7bdf9/.bambuhelper-validation
          curl -fsSL "$base/installer.zlib.b64" -o /tmp/installer.b64
          for n in 0 1 2 3; do curl -fsSL "$base/device.part$n" -o "/tmp/device.part$n"; done
          cat /tmp/device.part0 /tmp/device.part1 /tmp/device.part2 /tmp/device.part3 > /tmp/device.b64
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          pairs = [
              ('/tmp/installer.b64', 'apply_installer_evolution.py'),
              ('/tmp/device.b64', 'apply_device_onboarding_evolution.py'),
              ('.bambuhelper-validation/v2.zlib.b64', 'apply_resilience_evolution_v2.py'),
              ('.bambuhelper-validation/v3.zlib.b64', 'apply_smart_profiles_evolution_v3.py'),
          ]
          for source, target in pairs:
              payload = Path(source).read_text(encoding='utf-8').strip()
              raw = zlib.decompress(base64.b64decode(payload))
              Path(target).write_bytes(raw)
              print(f'rehydrated {target}: {len(raw)} bytes')
          PY
          python -m py_compile \
            apply_installer_evolution.py \
            apply_device_onboarding_evolution.py \
            apply_resilience_evolution_v2.py \
            apply_smart_profiles_evolution_v3.py

      - name: Apply Web Flasher evolution v1
        run: python apply_installer_evolution.py --repo upstream --apply

      - name: Apply device onboarding evolution v1
        run: python apply_device_onboarding_evolution.py --repo upstream --apply

      - name: Apply resilience evolution v2
        run: python apply_resilience_evolution_v2.py --repo upstream --apply

      - name: Apply Smart Remote Profiles evolution v3
        run: python apply_smart_profiles_evolution_v3.py --repo upstream --apply

      - name: Static integration checks
        shell: bash
        run: |
          set -euo pipefail
          node --check upstream/docs/flasher.js
          node --check upstream/web/app.js

          grep -Fq 'BOARD_VARIANT=\"ws_lcd_350\"' upstream/boards/ws_lcd_350.ini
          grep -Fq 'DISPLAY_320x480=1' upstream/boards/ws_lcd_350.ini
          grep -Fq 'USE_FT6336=1' upstream/boards/ws_lcd_350.ini

          grep -Fq 'Remote monitor profile' upstream/include/web_pages.h
          grep -Fq 'X2D dual-nozzle' upstream/include/web_pages.h
          grep -Fq 'AMS overview' upstream/include/web_pages.h
          grep -Fq 'BambuHelper smart remote profiles evolution v3' upstream/web/app.js
          grep -Fq "gauges: [1, 30, 29, 3, 14" upstream/web/app.js
          grep -Fq 'hasDualNozzle' upstream/web/app.js
          grep -Fq 'hasAuxFanRight' upstream/web/app.js
          grep -Fq 'saveGaugeLayout();' upstream/web/app.js
          grep -Fq 'Profiles are not available on the round dashboard' upstream/web/app.js

          grep -Fq 'Setup health' upstream/include/web_pages.h
          grep -Fq 'Export Support Report' upstream/include/web_pages.h
          grep -Fq 'Email code is recommended.' upstream/include/web_pages.h
          grep -Fq 'Save &amp; Verify' upstream/include/web_pages.h
          grep -Fq 'Export diagnostics' upstream/docs/index.html

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build Waveshare 3.5 firmware
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Build merged fresh-install binary
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Produce validation report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BambuHelper ws_lcd_350 Smart Remote Profiles v3 validation'
            echo '========================================================='
            echo 'upstream_commit=8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4'
            echo 'board=ws_lcd_350'
            echo 'panel=ST7796_320x480_FT6336'
            echo 'layers=web-flasher-v1,device-onboarding-v1,resilience-v2,smart-profiles-v3'
            echo 'profile_remote_status=present'
            echo 'profile_x2d_dual_nozzle=present'
            echo 'profile_thermal_fans=present'
            echo 'profile_ams_overview=present'
            echo 'capability_aware_fallback=present'
            echo
            echo 'Build artifacts:'
            find upstream/.pio/build/ws_lcd_350 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            echo
            echo 'Merged full binaries:'
            find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' -printf '%p %s bytes\n' | sort
            echo
            echo 'SHA256:'
            find upstream/.pio/build/ws_lcd_350 upstream/firmware -type f \( -name 'firmware.bin' -o -name 'BambuHelper-ws_lcd_350-*-Full.bin' \) -print0 | sort -z | xargs -0 sha256sum
          } | tee validation-report-v3.txt

      - name: Upload v3 validated firmware and report
        uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-profiles-v3
          if-no-files-found: error
          retention-days: 7
          path: |
            upstream/.pio/build/ws_lcd_350/firmware.bin
            upstream/firmware/*/BambuHelper-ws_lcd_350-*-Full.bin
            validation-report-v3.txt
