name: Apply rc10 OTA Asset Digest Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/rc10_ota_asset_digest_fix.py'
      - '.github/workflows/rc10-ota-asset-digest-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply migration
        run: python3 tools/rc10_ota_asset_digest_fix.py
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome/AppModel.h firmware/waveshare-home/WaveshareHome/Services.cpp
          git diff --cached --quiet && exit 0
          git commit -m 'Use GitHub asset digest for device OTA in rc10'
          git push
