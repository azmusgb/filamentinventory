          # printer screen richer
          replace(ino, '''else snprintf(b,sizeof(b),"P1S • %s\\n\\nJob       %s\\nProgress  %u%%\\nRemaining %s\\nLayer     %d / %d\\nNozzle    %.0f°C\\nBed       %.0f°C\\nAMS       %d loaded slots\\nHumidity  %d\\nError     %lu",state.printer.status,strlen(state.printer.jobName)?state.printer.jobName:"—",state.printer.progress,formatMinutes(state.printer.remainingMinutes).c_str(),state.printer.currentLayer,state.printer.totalLayers,state.printer.nozzleC,state.printer.bedC,state.printer.amsLoadedSlots,state.printer.amsHumidity,(unsigned long)state.printer.errorCode);''', '''else { String ams; for(int i=0;i<4;i++){auto &sl=state.printer.amsSlots[i];ams+=String("A")+(i+1)+(sl.active?"* ":"  ");ams+=sl.loaded?(strlen(sl.material)?sl.material:"Loaded"):"Empty";if(sl.remainingPercent>=0)ams+=String(" • ")+sl.remainingPercent+"%";ams+="\\n";} snprintf(b,sizeof(b),"%s • %s\\n\\n%s\\n%u%% • %s remaining\\nFinish in ~%d min\\nLayer %d / %d\\n\\nNozzle %.0f/%.0f°C • Bed %.0f/%.0f°C\\nChamber %.0f°C • Speed %d%%\\nFans P%d A%d C%d\\n\\nAMS\\n%sHumidity %d\\nError 0x%lX",strlen(state.printer.displayName)?state.printer.displayName:"P1S",state.printer.status,strlen(state.printer.jobName)?state.printer.jobName:"No active job",state.printer.progress,formatMinutes(state.printer.remainingMinutes).c_str(),state.printer.remainingMinutes,state.printer.currentLayer,state.printer.totalLayers,state.printer.nozzleC,state.printer.nozzleTargetC,state.printer.bedC,state.printer.bedTargetC,state.printer.chamberC,state.printer.speedPercent,state.printer.partFan,state.printer.auxFan,state.printer.chamberFan,ams.c_str(),state.printer.amsHumidity,(unsigned long)state.printer.errorCode); }''')

