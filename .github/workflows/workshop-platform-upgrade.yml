name: Workshop Platform Upgrade

on:
  push:
    paths:
      - '.github/workflows/workshop-platform-upgrade.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply workshop platform expansion
        shell: python {0}
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'Expected block not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,count))

