          replace(ino, '''    {"Quick", ScreenId::Quick, C_BLUE}, {"Settings", ScreenId::Settings, C_PURPLE}, {"System", ScreenId::System, C_GREEN}
  };''', '''    {"Workshop", ScreenId::Workshop, C_ORANGE}, {"Activity", ScreenId::Activity, C_PURPLE}, {"System", ScreenId::System, C_GREEN}
  };''')
          replace(ino, '''static void refreshSystem() {''', '''static void refreshWorkshop() {
  if(!workshopBody)return; char b[700]; auto &w=state.workshop; auto &e=w.environment; auto &d=w.dryer;
  char dryer[96]; if(d.running)snprintf(dryer,sizeof(dryer),"%s • %u°C • %luh %02lum remaining",d.material,d.targetC,(unsigned long)(d.remainingSec/3600UL),(unsigned long)((d.remainingSec/60UL)%60UL)); else snprintf(dryer,sizeof(dryer),"%s",d.completed?"Complete":"Idle");
  if(e.online&&!e.stale) snprintf(b,sizeof(b),"PRINTER  %s%s\nFILAMENT %d spools • %d low\nDRYER    %s\nAIR      %.0f°F • %.0f%% RH\nPM2.5    %.1f • VOC %.0f • CO₂ %.0f ppm\nFILTER   %s%s%s\nPRESENCE %s",state.printer.online?state.printer.status:"Offline",state.printer.printing?" • active":"",state.filament.totalSpools,state.filament.lowSpools,dryer,e.temperatureC*9.0f/5.0f+32.0f,e.humidity,e.pm25,e.voc,e.co2,w.filterRequested?"ON":"off",strlen(w.filterReason)?" • ":"",w.filterReason,e.presence?"Detected":"Clear");
  else snprintf(b,sizeof(b),"PRINTER  %s\nFILAMENT %d spools • %d low\nDRYER    %s\nAIR      No sensor connected\nFILTER   %s%s%s\n\nExternal ESP32/sensor nodes can POST to /api/sensor.",state.printer.online?state.printer.status:"Offline",state.filament.totalSpools,state.filament.lowSpools,dryer,w.filterRequested?"ON":"off",strlen(w.filterReason)?" • ":"",w.filterReason);
  lv_label_set_text(workshopBody,b);
}

static void refreshActivity() {
  if(!activityBody)return; String b; for(uint8_t i=0;i<state.activityCount&&i<8;i++){auto &a=state.activity[i];b+=String(a.source)+" • "+a.title;if(strlen(a.detail)){b+="\n";b+=a.detail;}b+="\n\n";} if(!b.length())b="No activity yet.";lv_label_set_text(activityBody,b.c_str());
}

static void refreshSystem() {''')
          replace(ino, '''  refreshStatusBars(); refreshHome(); refreshToday(); refreshControls(); refreshAttention(); refreshSettings(); refreshWifi(); refreshTimers(); refreshPrinter(); refreshFilament(); refreshSystem(); refreshAmbient();''', '''  refreshStatusBars(); refreshHome(); refreshToday(); refreshControls(); refreshAttention(); refreshSettings(); refreshWifi(); refreshTimers(); refreshPrinter(); refreshFilament(); refreshWorkshop(); refreshActivity(); refreshSystem(); refreshAmbient();''')
