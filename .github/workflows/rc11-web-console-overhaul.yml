name: Apply rc11 Rich Web Console Overhaul

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/rc11_web_console_overhaul.py'
      - '.github/workflows/rc11-web-console-overhaul.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply rc11 web console migration
        run: python3 tools/rc11_web_console_overhaul.py

      - name: Review generated changes
        run: |
          git diff --check
          git diff --stat
          grep -n 'FW_VERSION' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -n 'LOCAL CONTROL PLANE\|DEVICE-MANAGED OTA\|liveFirmware' firmware/waveshare-home/WaveshareHome/Services.cpp

      - name: Commit rc11 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome/AppModel.h firmware/waveshare-home/WaveshareHome/Services.cpp
          git commit -m 'Overhaul web command center UX for rc11'
          git push

      - name: Trigger firmware validation build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run waveshare-home.yml --ref main
