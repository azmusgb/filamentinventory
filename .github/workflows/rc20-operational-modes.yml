name: Apply rc20 Operational Modes

on:
  push:
    paths:
      - 'tools/rc20_operational_modes.py'
      - '.github/workflows/rc20-operational-modes.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply rc20 evolution
        run: python3 tools/rc20_operational_modes.py
      - name: Validate evolution
        run: |
          grep -q '1.0.0-rc20' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -q 'screenModes' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'createModes' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'refreshModes' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'applyOperationalMode' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
      - name: Commit rc20 firmware
        run: |
          if git diff --quiet; then
            echo 'No firmware changes needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add firmware/waveshare-home/WaveshareHome/AppModel.h firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
            git commit -m 'Add operational modes for rc20'
            git push
          fi
      - name: Trigger validated firmware build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml --repo '${{ github.repository }}'
