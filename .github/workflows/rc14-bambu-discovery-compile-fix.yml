name: Apply rc14 Bambu Discovery Compile Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/rc14_bambu_discovery_compile_fix.py'
      - '.github/workflows/rc14-bambu-discovery-compile-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply compile fix
        run: python3 tools/rc14_bambu_discovery_compile_fix.py

      - name: Validate probe strings
        run: |
          grep -Fq 'probe += "M-SEARCH * HTTP/1.1\r\n";' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -Fq 'MAN: \"ssdp:discover\"\r\nMX: 2\r\nST:' firmware/waveshare-home/WaveshareHome/Services.cpp

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome/Services.cpp
          git commit -m 'Fix rc14 Bambu discovery probe strings'
          git push origin HEAD:main

      - name: Trigger firmware validation build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml --repo '${{ github.repository }}' --ref main
