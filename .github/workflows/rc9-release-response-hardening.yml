name: Apply rc9 Release Response Hardening

on:
  push:
    paths:
      - 'tools/rc9_release_response_hardening.py'
      - '.github/workflows/rc9-release-response-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply hardening
        run: python3 tools/rc9_release_response_hardening.py

      - name: Validate hardening
        run: |
          grep -q 'releases?per_page=1' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'Accept-Encoding", "identity' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'releasePayload = http.getString' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'manifestPayload = manifestHttp.getString' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'FW_VERSION\[\] = "1.0.0-rc9"' firmware/waveshare-home/WaveshareHome/AppModel.h

      - name: Commit firmware changes
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome/Services.cpp
          git commit -m 'Harden GitHub OTA response handling for rc9'
          git push
