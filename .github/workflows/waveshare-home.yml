name: Build Waveshare Home Firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'firmware/waveshare-home/**'
      - '.github/workflows/waveshare-home.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino package index
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core install esp32:esp32@3.2.0
          arduino-cli lib install "lvgl@8.4.0"
          arduino-cli lib install "GFX Library for Arduino@1.5.5"
          arduino-cli lib install "SensorLib@0.3.1"
          arduino-cli lib install "TCA9554@0.1.2"
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli lib install "PubSubClient@2.8"

      - name: Install official Waveshare ES8311 library
        run: |
          git clone --depth 1 https://github.com/waveshareteam/ESP32-S3-Touch-LCD-3.5.git /tmp/waveshare-350
          mkdir -p "$HOME/Arduino/libraries"
          cp -R /tmp/waveshare-350/Arduino/libraries/es8311 "$HOME/Arduino/libraries/es8311"

      - name: Compile
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB \
            --build-property "compiler.cpp.extra_flags=-DLV_CONF_INCLUDE_SIMPLE" \
            --build-property "compiler.c.extra_flags=-DLV_CONF_INCLUDE_SIMPLE" \
            --output-dir build \
            firmware/waveshare-home/WaveshareHome
          ls -lah build

      - name: Verify OTA partition layout
        run: |
          python3 "$HOME/.arduino15/packages/esp32/hardware/esp32/3.2.0/tools/gen_esp32part.py" build/WaveshareHome.ino.partitions.bin | tee build/partition-layout.txt
          grep -q 'app0,app,ota_0,0x10000,4M' build/partition-layout.txt
          grep -q 'app1,app,ota_1,0x410000,4M' build/partition-layout.txt
          grep -q 'otadata,data,ota,0xe000,8K' build/partition-layout.txt

      - name: Prepare firmware files
        run: |
          cp build/WaveshareHome.ino.bin build/WaveshareHome-firmware.bin
          cp build/WaveshareHome.ino.bootloader.bin build/WaveshareHome-bootloader.bin
          cp build/WaveshareHome.ino.partitions.bin build/WaveshareHome-partitions.bin

          # Arduino-ESP32 already emits the authoritative full-flash image. Use it
          # instead of rebuilding a partial image that omits OTA initialization data.
          test -f build/WaveshareHome.ino.merged.bin
          cp build/WaveshareHome.ino.merged.bin build/WaveshareHome-merged.bin

          # A true 16 MB merged image should be 0x1000000 bytes. Reject partial images.
          test "$(stat -c%s build/WaveshareHome-merged.bin)" -eq 16777216
          ls -lh build/WaveshareHome-firmware.bin build/WaveshareHome-merged.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveshareHome-ESP32S3-rc5-fullflash
          path: |
            build/WaveshareHome-firmware.bin
            build/WaveshareHome-bootloader.bin
            build/WaveshareHome-partitions.bin
            build/WaveshareHome-merged.bin
            build/partition-layout.txt
          if-no-files-found: error
