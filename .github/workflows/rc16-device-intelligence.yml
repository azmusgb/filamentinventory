name: Apply rc16 Device Intelligence

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/rc16_device_intelligence.py'
      - '.github/workflows/rc16-device-intelligence.yml'

permissions:
  contents: write
  actions: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply rc16 evolution
        run: python3 tools/rc16_device_intelligence.py

      - name: Validate evolution
        run: |
          grep -q 'FW_VERSION\[\] = "1.0.0-rc16"' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -q 'QUICK CONTROL' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'UPDATE CENTER' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'Dryer ' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino

      - name: Commit rc16 firmware
        id: commit
        run: |
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome
          git commit -m 'Evolve Waveshare Home device intelligence for rc16'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Trigger firmware build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml --repo "${{ github.repository }}" --ref main
