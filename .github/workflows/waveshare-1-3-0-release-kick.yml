name: Kick Waveshare Home 1.3.0 Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/waveshare-1-3-0-release-kick.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run waveshare-release.yml --repo '${{ github.repository }}' --ref main
