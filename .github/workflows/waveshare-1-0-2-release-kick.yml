name: Publish Stable Waveshare Home 1.0.2

on:
  push:
    paths:
      - '.github/workflows/waveshare-1-0-2-release-kick.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Waveshare release publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run waveshare-release.yml --repo "${{ github.repository }}" --ref main
