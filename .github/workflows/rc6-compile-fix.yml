name: Apply rc6 Compile Fix

on:
  push:
    paths:
      - 'tools/rc6_compile_fix.py'
      - '.github/workflows/rc6-compile-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/rc6_compile_fix.py
      - run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/waveshare-home/WaveshareHome/Services.h
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix rc6 MQTT diagnostics getter"
          git push
