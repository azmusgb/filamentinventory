name: Bambu Printer Management Upgrade

on:
  push:
    paths:
      - '.github/workflows/bambu-management-upgrade.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade Bambu discovery, telemetry and management UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('firmware/waveshare-home/WaveshareHome')

          # ---------- App model ----------
          p = root / 'AppModel.h'
          s = p.read_text()
          s = s.replace('static constexpr char FW_VERSION[] = "1.0.0-rc1";', 'static constexpr char FW_VERSION[] = "1.0.0-rc2";')
          printer_block = r'''struct BambuDiscoveredPrinter {
            bool valid = false;
            char name[48] = "";
            char model[32] = "";
            char host[24] = "";
            char serial[40] = "";
            char version[32] = "";
            int signal = 0;
            uint32_t lastSeenMs = 0;
          };

          struct PrinterState {
            bool configured = false;
            bool online = false;
            bool printing = false;
            bool error = false;
            char status[28] = "Not configured";
            char stage[40] = "";
            char jobName[80] = "";
            char displayName[48] = "";
            char model[32] = "";
            char firmware[32] = "";
            char host[24] = "";
            char serial[40] = "";
            uint8_t progress = 0;
            int remainingMinutes = 0;
            float nozzleC = 0;
            float nozzleTargetC = 0;
            float bedC = 0;
            float bedTargetC = 0;
            float chamberC = 0;
            int currentLayer = 0;
            int totalLayers = 0;
            int speedLevel = 0;
            int speedPercent = 100;
            int partFan = 0;
            int auxFan = 0;
            int chamberFan = 0;
            int wifiSignal = 0;
            int amsLoadedSlots = 0;
            int activeTray = -1;
            int amsHumidity = -1;
            uint32_t errorCode = 0;
            uint32_t updatedMs = 0;
            uint32_t connectedMs = 0;
          };
          '''
          s, n = re.subn(r'struct PrinterState \{.*?\n\};\n\n(?=struct FilamentState)', printer_block + '\n', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('PrinterState block not found')
          p.write_text(s)

          # ---------- Service declarations ----------
          p = root / 'Services.h'
          s = p.read_text()
          if '#include <WiFiUdp.h>' not in s:
            s = s.replace('#include <WiFiClientSecure.h>\n', '#include <WiFiClientSecure.h>\n#include <WiFiUdp.h>\n')
          bambu_class = r'''class BambuPlugin : public ServicePlugin {
          public:
            BambuPlugin();
            const char *name() const override { return "Bambu"; }
            bool enabled(const AppConfig &config) const override { return config.bambuEnabled || discoveryRunning_; }
            void begin(AppConfig &config, AppState &state) override;
            void loop(AppConfig &config, AppState &state) override;
            void onConfigChanged(AppConfig &config, AppState &state) override;
            bool startDiscovery();
            bool discoveryRunning() const { return discoveryRunning_; }
            uint8_t discoveredCount() const { return discoveredCount_; }
            const BambuDiscoveredPrinter *discovered(uint8_t index) const { return index < discoveredCount_ ? &discovered_[index] : nullptr; }
            bool useDiscovered(AppConfig &config, AppState &state, uint8_t index);
          private:
            WiFiClientSecure tls_;
            PubSubClient mqtt_;
            WiFiUDP discoveryUdp_;
            AppConfig *config_ = nullptr;
            AppState *state_ = nullptr;
            uint32_t lastConnectAttemptMs_ = 0;
            uint32_t reconnectBackoffMs_ = 5000;
            bool discoveryRunning_ = false;
            uint32_t discoveryStartedMs_ = 0;
            BambuDiscoveredPrinter discovered_[6];
            uint8_t discoveredCount_ = 0;
            static BambuPlugin *instance_;
            static void callbackStatic(char *topic, byte *payload, unsigned int length);
            void callback(char *topic, byte *payload, unsigned int length);
            bool connectMqtt();
            void requestPushAll();
            void pollDiscovery();
            void parseDiscoveryPacket(const String &packet, const IPAddress &remoteIp);
            int findDiscovered(const char *serial, const char *host) const;
          };
          '''
          s, n = re.subn(r'class BambuPlugin : public ServicePlugin \{.*?\n\};\n\n(?=class FilamentPlugin)', bambu_class + '\n', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('BambuPlugin declaration not found')
          s = s.replace('WebDashboard(ConfigStore &store, ConnectivityService &connectivity, AudioService &audio,\n               TimerPlugin &timers, HomeAssistantPlugin &homeAssistant);',
                        'WebDashboard(ConfigStore &store, ConnectivityService &connectivity, AudioService &audio,\n               TimerPlugin &timers, HomeAssistantPlugin &homeAssistant, BambuPlugin &bambu);')
          s = s.replace('HomeAssistantPlugin &homeAssistant_;\n', 'HomeAssistantPlugin &homeAssistant_;\n  BambuPlugin &bambu_;\n')
          p.write_text(s)

          # ---------- Services implementation ----------
          p = root / 'Services.cpp'
          s = p.read_text()
          s = s.replace('constexpr uint32_t AUDIO_SAMPLE_RATE = 44100;\n',
                        'constexpr uint32_t AUDIO_SAMPLE_RATE = 44100;\nconstexpr uint16_t BAMBU_DISCOVERY_PORT = 2021;\nconstexpr uint32_t BAMBU_DISCOVERY_MS = 9000UL;\nconst IPAddress BAMBU_DISCOVERY_GROUP(239, 255, 255, 250);\n')

          discovery_impl = r'''
          bool BambuPlugin::startDiscovery() {
            if (WiFi.status() != WL_CONNECTED) return false;
            discoveryUdp_.stop();
            discoveredCount_ = 0;
            for (auto &item : discovered_) item = BambuDiscoveredPrinter{};
            if (!discoveryUdp_.beginMulticast(BAMBU_DISCOVERY_GROUP, BAMBU_DISCOVERY_PORT)) return false;
            discoveryRunning_ = true;
            discoveryStartedMs_ = millis();
            const char *probe = "M-SEARCH * HTTP/1.1\r\nHOST: 239.255.255.250:2021\r\nMAN: \"ssdp:discover\"\r\nST: urn:bambulab-com:device:3dprinter:1\r\nMX: 3\r\n\r\n";
            discoveryUdp_.beginPacketMulticast(BAMBU_DISCOVERY_GROUP, BAMBU_DISCOVERY_PORT, WiFi.localIP());
            discoveryUdp_.write(reinterpret_cast<const uint8_t *>(probe), strlen(probe));
            discoveryUdp_.endPacket();
            return true;
          }

          int BambuPlugin::findDiscovered(const char *serial, const char *host) const {
            for (uint8_t i = 0; i < discoveredCount_; ++i) {
              if (serial && *serial && !strcmp(discovered_[i].serial, serial)) return i;
              if (host && *host && !strcmp(discovered_[i].host, host)) return i;
            }
            return -1;
          }

          void BambuPlugin::parseDiscoveryPacket(const String &packet, const IPAddress &remoteIp) {
            auto value = [&](const char *key) -> String {
              String needle = String(key) + ":";
              int start = packet.indexOf(needle);
              if (start < 0) return String();
              start += needle.length();
              while (start < packet.length() && (packet[start] == ' ' || packet[start] == '\t')) start++;
              int end = packet.indexOf('\n', start);
              if (end < 0) end = packet.length();
              String out = packet.substring(start, end);
              out.trim();
              return out;
            };
            String serial = value("DevSerial");
            String host = value("Location");
            if (!host.length()) host = remoteIp.toString();
            host.replace("http://", ""); host.replace("https://", "");
            int slash = host.indexOf('/'); if (slash >= 0) host = host.substring(0, slash);
            int colon = host.indexOf(':'); if (colon >= 0) host = host.substring(0, colon);
            String nt = value("NT");
            if (!serial.length() && nt.indexOf("bambulab") < 0 && packet.indexOf("Bambu") < 0 && packet.indexOf("DevModel") < 0) return;
            int index = findDiscovered(serial.c_str(), host.c_str());
            if (index < 0) {
              if (discoveredCount_ >= 6) return;
              index = discoveredCount_++;
            }
            auto &d = discovered_[index];
            d.valid = true;
            copyText(d.host, sizeof(d.host), host);
            copyText(d.serial, sizeof(d.serial), serial);
            copyText(d.name, sizeof(d.name), value("DevName"));
            copyText(d.model, sizeof(d.model), value("DevModel"));
            copyText(d.version, sizeof(d.version), value("DevVersion"));
            d.signal = value("DevSignal").toInt();
            d.lastSeenMs = millis();
          }

          void BambuPlugin::pollDiscovery() {
            if (!discoveryRunning_) return;
            int size = discoveryUdp_.parsePacket();
            while (size > 0) {
              String packet;
              packet.reserve(size + 1);
              while (discoveryUdp_.available()) packet += static_cast<char>(discoveryUdp_.read());
              parseDiscoveryPacket(packet, discoveryUdp_.remoteIP());
              size = discoveryUdp_.parsePacket();
            }
            if (millis() - discoveryStartedMs_ >= BAMBU_DISCOVERY_MS) {
              discoveryRunning_ = false;
              discoveryUdp_.stop();
            }
          }

          bool BambuPlugin::useDiscovered(AppConfig &config, AppState &state, uint8_t index) {
            const BambuDiscoveredPrinter *d = discovered(index);
            if (!d || !d->valid) return false;
            copyText(config.bambuHost, sizeof(config.bambuHost), d->host);
            copyText(config.bambuSerial, sizeof(config.bambuSerial), d->serial);
            config.bambuEnabled = true;
            copyText(state.printer.displayName, sizeof(state.printer.displayName), d->name);
            copyText(state.printer.model, sizeof(state.printer.model), d->model);
            copyText(state.printer.firmware, sizeof(state.printer.firmware), d->version);
            copyText(state.printer.host, sizeof(state.printer.host), d->host);
            copyText(state.printer.serial, sizeof(state.printer.serial), d->serial);
            begin(config, state);
            return true;
          }

          '''
          marker = 'void BambuPlugin::begin(AppConfig &config, AppState &state) {'
          if discovery_impl.strip() not in s:
            if marker not in s: raise SystemExit('Bambu begin marker missing')
            s = s.replace(marker, discovery_impl + marker, 1)

          s = s.replace('void BambuPlugin::loop(AppConfig &config, AppState &state) {\n  if (!enabled(config) || !state.printer.configured || WiFi.status() != WL_CONNECTED) return;',
                        'void BambuPlugin::loop(AppConfig &config, AppState &state) {\n  if (WiFi.status() == WL_CONNECTED) pollDiscovery();\n  if (!config.bambuEnabled || !state.printer.configured || WiFi.status() != WL_CONNECTED) return;')

          s = s.replace('  p.nozzleC = print["nozzle_temper"] | p.nozzleC;\n  p.bedC = print["bed_temper"] | p.bedC;\n',
                        '  p.nozzleC = print["nozzle_temper"] | p.nozzleC;\n  p.nozzleTargetC = print["nozzle_target_temper"] | p.nozzleTargetC;\n  p.bedC = print["bed_temper"] | p.bedC;\n  p.bedTargetC = print["bed_target_temper"] | p.bedTargetC;\n  p.chamberC = print["chamber_temper"] | p.chamberC;\n  p.speedLevel = print["spd_lvl"] | p.speedLevel;\n  p.speedPercent = print["spd_mag"] | p.speedPercent;\n  p.partFan = String(print["cooling_fan_speed"] | String(p.partFan)).toInt();\n  p.auxFan = String(print["big_fan1_speed"] | String(p.auxFan)).toInt();\n  p.chamberFan = String(print["big_fan2_speed"] | String(p.chamberFan)).toInt();\n  p.wifiSignal = print["wifi_signal"] | p.wifiSignal;\n  String stage = print["mc_print_stage"] | p.stage;\n  if (stage.length()) copyText(p.stage, sizeof(p.stage), stage);\n')
          s = s.replace('  p.updatedMs = millis();\n}', '  if (p.connectedMs == 0) p.connectedMs = millis();\n  p.updatedMs = millis();\n}', 1)
          s = s.replace('  state_->printer.online = true;\n  requestPushAll();',
                        '  state_->printer.online = true;\n  state_->printer.connectedMs = millis();\n  copyText(state_->printer.host, sizeof(state_->printer.host), config_->bambuHost);\n  copyText(state_->printer.serial, sizeof(state_->printer.serial), config_->bambuSerial);\n  requestPushAll();')

          s = s.replace('WebDashboard::WebDashboard(ConfigStore &store, ConnectivityService &connectivity, AudioService &audio,\n                           TimerPlugin &timers, HomeAssistantPlugin &homeAssistant)\n  : server_(80), store_(store), connectivity_(connectivity), audio_(audio), timers_(timers), homeAssistant_(homeAssistant) {}',
                        'WebDashboard::WebDashboard(ConfigStore &store, ConnectivityService &connectivity, AudioService &audio,\n                           TimerPlugin &timers, HomeAssistantPlugin &homeAssistant, BambuPlugin &bambu)\n  : server_(80), store_(store), connectivity_(connectivity), audio_(audio), timers_(timers), homeAssistant_(homeAssistant), bambu_(bambu) {}')

          route_anchor = '  server_.on("/wifi/reconnect", HTTP_POST, [this]() { connectivity_.reconnect(); server_.send(200, "text/plain", "Reconnect requested"); });\n'
          routes = '''  server_.on("/bambu/scan", HTTP_POST, [this]() {\n    if (!bambu_.startDiscovery()) { server_.send(409, "text/plain", "Wi-Fi must be online to scan"); return; }\n    server_.sendHeader("Location", "/#bambu", true);\n    server_.send(303, "text/plain", "Scanning");\n  });\n  server_.on("/bambu/use", HTTP_POST, [this]() {\n    int index = server_.arg("index").toInt();\n    if (!bambu_.useDiscovered(*config_, *state_, index)) { server_.send(404, "text/plain", "Discovered printer not found"); return; }\n    store_.save(*config_); configChanged_ = true;\n    server_.sendHeader("Location", "/#bambu", true);\n    server_.send(303, "text/plain", "Printer selected");\n  });\n'''
          if routes not in s:
            if route_anchor not in s: raise SystemExit('route anchor missing')
            s = s.replace(route_anchor, routes + route_anchor, 1)

          bambu_ui = '''  s += F("<h3 id='bambu'>Bambu Lab</h3>");\n  s += F("<div class='card' style='margin:8px 0;background:#071015'><div class='top'><div><strong>");\n  s += strlen(state_->printer.displayName) ? htmlEscape(state_->printer.displayName) : (strlen(config_->bambuHost) ? htmlEscape(config_->bambuHost) : String("No printer selected"));\n  s += F("</strong><p>"); s += state_->printer.online ? "Connected via local MQTT" : (state_->printer.configured ? "Configured • waiting for MQTT" : "Not configured"); s += F("</p></div><span class='badge'>"); s += state_->printer.online ? "ONLINE" : "OFFLINE"; s += F("</span></div>");\n  if (state_->printer.online) {\n    s += F("<div class='grid'><div><h3>Status</h3><div class='metric'>"); s += htmlEscape(state_->printer.status); s += F("</div><p>"); s += htmlEscape(state_->printer.jobName); s += F("</p></div><div><h3>Progress</h3><div class='metric'>"); s += state_->printer.progress; s += F("%</div><p>"); s += state_->printer.remainingMinutes; s += F(" min remaining</p></div></div>");\n    s += F("<p>Nozzle "); s += String(state_->printer.nozzleC,1); s += F(" / "); s += String(state_->printer.nozzleTargetC,1); s += F(" C • Bed "); s += String(state_->printer.bedC,1); s += F(" / "); s += String(state_->printer.bedTargetC,1); s += F(" C • Chamber "); s += String(state_->printer.chamberC,1); s += F(" C<br>Layer "); s += state_->printer.currentLayer; s += F(" / "); s += state_->printer.totalLayers; s += F(" • Speed "); s += state_->printer.speedPercent; s += F("% • AMS slots "); s += state_->printer.amsLoadedSlots; s += F(" • Active tray "); s += state_->printer.activeTray; s += F(" • AMS humidity "); s += state_->printer.amsHumidity; s += F("<br>Fans: part "); s += state_->printer.partFan; s += F(" • aux "); s += state_->printer.auxFan; s += F(" • chamber "); s += state_->printer.chamberFan; s += F(" • Error 0x"); s += String(state_->printer.errorCode, HEX); s += F("</p>");\n  }\n  s += F("</div><form method='post' action='/bambu/scan'><button class='muted'>Scan local network for Bambu printers</button></form>");\n  if (bambu_.discoveryRunning()) s += F("<p class='warn'>Scanning for Bambu SSDP announcements… refresh this page in a few seconds.</p>");\n  if (bambu_.discoveredCount()) { s += F("<label>Discovered printers</label>"); for (uint8_t i=0;i<bambu_.discoveredCount();++i) { const auto *d=bambu_.discovered(i); if(!d) continue; s += F("<form method='post' action='/bambu/use' class='card' style='margin:6px 0'><input type='hidden' name='index' value='"); s += i; s += F("'><strong>"); s += htmlEscape(strlen(d->name)?d->name:d->model); s += F("</strong><p>"); s += htmlEscape(d->model); s += F(" • "); s += htmlEscape(d->host); s += F("<br>Serial "); s += htmlEscape(d->serial); if(strlen(d->version)){s += F(" • FW "); s += htmlEscape(d->version);} s += F("</p><button type='submit'>Use this printer</button></form>"); } }\n  s += F("<label><input type='checkbox' name='bambuEnabled'"); s += checked(config_->bambuEnabled); s += F(">Enable local MQTT monitoring</label><div class='row'><div><label>Printer IP / host</label><input name='bambuHost' value='"); s += htmlEscape(config_->bambuHost); s += F("'></div><div><label>Printer serial</label><input name='bambuSerial' value='"); s += htmlEscape(config_->bambuSerial); s += F("'></div></div><label>LAN access code</label><input type='password' name='bambuAccessCode' placeholder='Leave blank to keep saved code'><p><small>Discovery fills IP and serial automatically. The printer's LAN access code is still required for MQTT telemetry.</small></p><hr>");\n'''
          pattern = r'  s \+= F\("<h3>Bambu Lab</h3>.*?<hr>"\);\n'
          s, n = re.subn(pattern, bambu_ui, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Bambu dashboard block not found')

          old_json = '''  doc["printer"]["online"] = state_->printer.online;\n  doc["printer"]["status"] = state_->printer.status;\n  doc["printer"]["progress"] = state_->printer.progress;\n  doc["printer"]["remainingMinutes"] = state_->printer.remainingMinutes;\n'''
          new_json = '''  doc["printer"]["configured"] = state_->printer.configured;\n  doc["printer"]["online"] = state_->printer.online;\n  doc["printer"]["name"] = state_->printer.displayName;\n  doc["printer"]["model"] = state_->printer.model;\n  doc["printer"]["host"] = config_->bambuHost;\n  doc["printer"]["serial"] = config_->bambuSerial;\n  doc["printer"]["status"] = state_->printer.status;\n  doc["printer"]["stage"] = state_->printer.stage;\n  doc["printer"]["job"] = state_->printer.jobName;\n  doc["printer"]["progress"] = state_->printer.progress;\n  doc["printer"]["remainingMinutes"] = state_->printer.remainingMinutes;\n  doc["printer"]["nozzleC"] = state_->printer.nozzleC;\n  doc["printer"]["nozzleTargetC"] = state_->printer.nozzleTargetC;\n  doc["printer"]["bedC"] = state_->printer.bedC;\n  doc["printer"]["bedTargetC"] = state_->printer.bedTargetC;\n  doc["printer"]["chamberC"] = state_->printer.chamberC;\n  doc["printer"]["layer"] = state_->printer.currentLayer;\n  doc["printer"]["totalLayers"] = state_->printer.totalLayers;\n  doc["printer"]["speedPercent"] = state_->printer.speedPercent;\n  doc["printer"]["partFan"] = state_->printer.partFan;\n  doc["printer"]["auxFan"] = state_->printer.auxFan;\n  doc["printer"]["chamberFan"] = state_->printer.chamberFan;\n  doc["printer"]["amsLoadedSlots"] = state_->printer.amsLoadedSlots;\n  doc["printer"]["activeTray"] = state_->printer.activeTray;\n  doc["printer"]["amsHumidity"] = state_->printer.amsHumidity;\n  doc["printer"]["errorCode"] = state_->printer.errorCode;\n  doc["printer"]["updatedMs"] = state_->printer.updatedMs;\n  doc["printerDiscovery"]["running"] = bambu_.discoveryRunning();\n  doc["printerDiscovery"]["count"] = bambu_.discoveredCount();\n'''
          if old_json not in s: raise SystemExit('printer JSON block missing')
          s = s.replace(old_json, new_json, 1)
          p.write_text(s)

          # ---------- Main UI wiring ----------
          p = root / 'WaveshareHome.ino'
          s = p.read_text()
          s = s.replace('WebDashboard webDashboard(configStore, connectivity, audio, timerPlugin, homeAssistantPlugin);',
                        'WebDashboard webDashboard(configStore, connectivity, audio, timerPlugin, homeAssistantPlugin, bambuPlugin);')
          p.write_text(s)
          PY

      - name: Validate source changes
        run: |
          git diff --check
          grep -n "startDiscovery\|printerDiscovery\|Scan local network" firmware/waveshare-home/WaveshareHome/Services.cpp

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/waveshare-home/WaveshareHome/AppModel.h firmware/waveshare-home/WaveshareHome/Services.h firmware/waveshare-home/WaveshareHome/Services.cpp firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          git commit -m "Upgrade Bambu printer discovery and telemetry"
          git push
