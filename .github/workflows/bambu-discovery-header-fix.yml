name: Bambu Discovery Header Fix

on:
  push:
    paths:
      - '.github/workflows/bambu-discovery-header-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct Bambu SSDP headers and model names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('firmware/waveshare-home/WaveshareHome/Services.cpp')
          s = p.read_text()

          replacements = {
              'String serial = value("DevSerial");': 'String serial = value("USN");',
              'copyText(d.name, sizeof(d.name), value("DevName"));': 'copyText(d.name, sizeof(d.name), value("DevName.bambu.com"));',
              'copyText(d.model, sizeof(d.model), value("DevModel"));': '''String modelCode = value("DevModel.bambu.com");\n  String modelName = modelCode;\n  if (modelCode == "C12") modelName = "P1S";\n  else if (modelCode == "C11") modelName = "P1P";\n  else if (modelCode == "N1") modelName = "A1 mini";\n  else if (modelCode == "N2S") modelName = "A1";\n  else if (modelCode == "BL-P001" || modelCode == "3DPrinter-X1-Carbon") modelName = "X1 Carbon";\n  else if (modelCode == "BL-P002" || modelCode == "3DPrinter-X1") modelName = "X1";\n  else if (modelCode == "C13") modelName = "X1E";\n  else if (modelCode == "O1D") modelName = "H2D";\n  copyText(d.model, sizeof(d.model), modelName);''',
              'copyText(d.version, sizeof(d.version), value("DevVersion"));': 'copyText(d.version, sizeof(d.version), value("DevVersion.bambu.com"));',
              'd.signal = value("DevSignal").toInt();': 'd.signal = value("DevSignal.bambu.com").toInt();',
              'packet.indexOf("DevModel") < 0': 'packet.indexOf("DevModel.bambu.com") < 0',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected source not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          app = Path('firmware/waveshare-home/WaveshareHome/AppModel.h')
          a = app.read_text()
          a = a.replace('static constexpr char FW_VERSION[] = "1.0.0-rc2";', 'static constexpr char FW_VERSION[] = "1.0.0-rc3";')
          app.write_text(a)
          PY
          git diff --check

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/waveshare-home/WaveshareHome/Services.cpp firmware/waveshare-home/WaveshareHome/AppModel.h
          git commit -m "Fix Bambu SSDP discovery headers and model mapping"
          git push
