name: BambuHelper ws_lcd_350 Smart Workshop v7 validation

on:
  push:
    branches: [bambuhelper-v7-validation]
    paths:
      - '.github/workflows/bambuhelper-v7-validation.yml'
      - '.bambuhelper-validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Patch, smart-workshop, and build WS350 v7
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4

      - name: Checkout pinned BambuHelper source
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rehydrate evolution patchers v1-v7
        shell: bash
        run: |
          set -euo pipefail
          v1=https://raw.githubusercontent.com/azmusgb/filamentinventory/741a6f0651fb4e20d8e2674f2c0ce726b0d7bdf9/.bambuhelper-validation
          v3=https://raw.githubusercontent.com/azmusgb/filamentinventory/07ce909fa7dd485abfc556eaf9addfbbd82e3cb3/.bambuhelper-validation
          v6=https://raw.githubusercontent.com/azmusgb/filamentinventory/c1a6cdf389be14b18f26eecefd5c5a62b5d1e7dc/.bambuhelper-validation

          curl -fsSL "$v1/installer.zlib.b64" -o /tmp/installer.b64
          for n in 0 1 2 3; do
            curl -fsSL "$v1/device.part$n" -o "/tmp/device.part$n"
          done
          cat /tmp/device.part{0,1,2,3} > /tmp/device.b64
          curl -fsSL "$v3/v2.zlib.b64" -o /tmp/v2.b64
          curl -fsSL "$v3/v3.zlib.b64" -o /tmp/v3.b64
          curl -fsSL "$v6/v4.zlib.b64" -o /tmp/v4.b64
          curl -fsSL "$v6/v5.zlib.b64" -o /tmp/v5.b64
          curl -fsSL "$v6/v6.zlib.b64" -o /tmp/v6.b64
          cat .bambuhelper-validation/v7.chunk{0,1,2,3,4} > /tmp/v7.b64

          python - <<'PY'
          from pathlib import Path
          import base64, zlib

          pairs = [
              ('/tmp/installer.b64', 'apply_installer_evolution.py'),
              ('/tmp/device.b64', 'apply_device_onboarding_evolution.py'),
              ('/tmp/v2.b64', 'apply_resilience_evolution_v2.py'),
              ('/tmp/v3.b64', 'apply_smart_profiles_evolution_v3.py'),
              ('/tmp/v4.b64', 'apply_ws350_remote_dashboard_v4.py'),
              ('/tmp/v5.b64', 'apply_commissioning_evolution_v5.py'),
              ('/tmp/v6.b64', 'apply_smart_display_platform_v6.py'),
              ('/tmp/v7.b64', 'apply_smart_workshop_v7.py'),
          ]
          for src, dst in pairs:
              raw = zlib.decompress(base64.b64decode(Path(src).read_text().strip()))
              Path(dst).write_bytes(raw)
              print(dst, len(raw))
          PY

      - name: Repair v3 duplicate-anchor patcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apply_smart_profiles_evolution_v3.py')
          text = p.read_text(encoding='utf-8')
          needle = '"app/profile-account-selection",'
          pos = text.find(needle)
          if pos >= 0:
              start = text.rfind('    text = replace_once(', 0, pos)
              end = text.find('\n    )', pos)
              if min(start, end) < 0:
                  raise SystemExit('v3 repair anchor malformed')
              end += len('\n    )')
              replacement = """    profile_refresh_anchor = '''  updatePrinterOnboarding();\n  refreshPrinterHealth(false);'''\n    profile_refresh_count = text.count(profile_refresh_anchor)\n    if profile_refresh_count < 1:\n        raise PatchError(\n            \"app/profile-context-refresh: expected at least one v2 refresh anchor\"\n        )\n    text = text.replace(\n        profile_refresh_anchor,\n        '''  updatePrinterOnboarding();\n  refreshGaugeProfileUi();\n  refreshPrinterHealth(false);''',\n    )"""
              text = text[:start] + replacement + text[end:]
              p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile apply_*.py

      - name: Apply evolution stack v1-v7
        shell: bash
        run: |
          set -euo pipefail
          python apply_installer_evolution.py --repo upstream --apply
          python apply_device_onboarding_evolution.py --repo upstream --apply
          python apply_resilience_evolution_v2.py --repo upstream --apply
          python apply_smart_profiles_evolution_v3.py --repo upstream --apply
          python apply_ws350_remote_dashboard_v4.py --repo upstream --apply
          python apply_commissioning_evolution_v5.py --repo upstream --apply
          python apply_smart_display_platform_v6.py --repo upstream --apply
          python apply_smart_workshop_v7.py --repo upstream --apply

      - name: Static integration checks
        shell: bash
        run: |
          set -euo pipefail
          node --check upstream/docs/flasher.js
          node --check upstream/web/app.js

          test -f upstream/src/smart_hub.h
          test -f upstream/src/smart_hub.cpp
          grep -Fq 'DEFAULT_INVENTORY_URL' upstream/src/smart_hub.cpp
          grep -Fq 'https://filamentinventory.netlify.app/api/display-feed' upstream/src/smart_hub.cpp
          grep -Fq 'autoRotate' upstream/src/smart_hub.cpp
          grep -Fq 'dwellSeconds' upstream/src/smart_hub.cpp
          grep -Fq 'pageOrder' upstream/src/smart_hub.cpp
          grep -Fq 'sourceStale' upstream/src/smart_hub.cpp
          grep -Fq 'x-filament-sync-key' upstream/src/smart_hub.cpp
          grep -Fq 'x-filament-profile' upstream/src/smart_hub.cpp
          grep -Fq 'inventorySyncKey' upstream/src/smart_hub.h
          grep -Fq 'hasInventorySyncKey' upstream/src/web_server.cpp
          grep -Fq 'Smart Workshop Display' upstream/include/web_pages.h
          grep -Fq 'hubSyncKey' upstream/include/web_pages.h
          grep -Fq 'useInventoryFeed' upstream/web/app.js
          grep -Fq 'BH_INVENTORY_FEED' upstream/web/app.js
          grep -Fq 'hub-v7-card' upstream/web/app.css
          grep -Fq 'server.on("/hub/config"' upstream/src/web_server.cpp
          grep -Fq 'BOARD_IS_WS350=1' upstream/boards/ws_lcd_350.ini
          grep -Fq 'DISPLAY_320x480=1' upstream/boards/ws_lcd_350.ini
          grep -Fq 'USE_FT6336=1' upstream/boards/ws_lcd_350.ini

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350 Smart Workshop v7
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Build shared 320x480 regression target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge fresh-install image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Produce validation report
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' | sort | tail -1)"
          APP="upstream/.pio/build/ws_lcd_350/firmware.bin"
          test -n "$FULL"
          test -f "$FULL"
          test -f "$APP"
          {
            echo 'BambuHelper ws_lcd_350 Smart Workshop Appliance v7 validation'
            echo '============================================================'
            echo 'upstream_commit=8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4'
            echo 'board=ws_lcd_350'
            echo 'panel=ST7796_320x480_FT6336'
            echo 'layers=v1,v1-device,v2,v3,v4,v5,v6,v7'
            echo 'context_aware_home=PASS'
            echo 'filament_inventory_feed_contract=PASS'
            echo 'private_inventory_auth_headers=PASS'
            echo 'write_only_inventory_sync_key=PASS'
            echo 'idle_auto_rotation=PASS'
            echo 'configurable_page_order=PASS'
            echo 'configurable_dwell=PASS'
            echo 'print_return_priority=PASS'
            echo 'stale_feed_fallback=PASS'
            echo 'workshop_page_v7=PASS'
            echo 'shared_layout_regression=jc3248w535_passed'
            echo "full_image=$FULL"
            echo 'SHA256:'
            sha256sum "$FULL"
            sha256sum "$APP"
          } | tee validation-report-v7.txt

      - name: Upload validated firmware
        uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-smart-workshop-v7
          retention-days: 7
          if-no-files-found: error
          path: |
            upstream/.pio/build/ws_lcd_350/firmware.bin
            upstream/firmware/*/BambuHelper-ws_lcd_350-*-Full.bin
            validation-report-v7.txt
