name: Apply Waveshare Home 1.0.1 Updater Hardening

on:
  workflow_dispatch:
  push:
    paths:
      - tools/waveshare_1_0_1_updater_hardening.py
      - .github/workflows/waveshare-1-0-1-updater-hardening.yml

permissions:
  contents: write
  actions: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Apply 1.0.1 updater hardening
        run: python3 tools/waveshare_1_0_1_updater_hardening.py

      - name: Validate migration
        run: |
          grep -F 'FW_VERSION[] = "1.0.1"' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -F 'updateCheckRequested_' firmware/waveshare-home/WaveshareHome/Services.h
          grep -F 'MALLOC_CAP_SPIRAM' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -F 'Update check queued' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -F 'installQueued' firmware/waveshare-home/WaveshareHome/Services.cpp

      - name: Commit firmware changes
        id: commit
        run: |
          if git diff --quiet -- firmware/waveshare-home/WaveshareHome; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add firmware/waveshare-home/WaveshareHome
          git commit -m "Harden Waveshare Home updater for 1.0.1"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch firmware build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml --repo "${{ github.repository }}" --ref main
