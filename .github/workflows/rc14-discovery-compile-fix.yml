name: Apply rc14 Discovery Compile Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/rc14_discovery_compile_fix.py'
      - '.github/workflows/rc14-discovery-compile-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fix rc14 SSDP probe string escaping
        run: python3 tools/rc14_discovery_compile_fix.py

      - name: Validate source
        run: |
          grep -q 'FW_VERSION\[\].*1.0.0-rc14' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -q 'M-SEARCH \* HTTP/1.1\\\\r\\\\n' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'BAMBU_DISCOVERY_LEGACY_PORT = 1990' firmware/waveshare-home/WaveshareHome/Services.cpp

      - name: Commit compile fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome/Services.cpp
          git commit -m 'Fix rc14 Bambu discovery probe escaping'
          git push origin HEAD:main

      - name: Trigger firmware validation build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml --repo '${{ github.repository }}' --ref main
