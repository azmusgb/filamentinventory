name: Apply rc19 Automation Center

on:
  push:
    paths:
      - 'tools/rc19_automation_center.py'
      - '.github/workflows/rc19-automation-center.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply rc19 evolution
        run: python3 tools/rc19_automation_center.py
      - name: Validate evolution
        run: |
          grep -q '1.0.0-rc19' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -q 'screenAutomation' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'createAutomation' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'refreshAutomation' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'Air quality guard' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'OTA boot protection' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
      - name: Commit rc19 firmware
        run: |
          if git diff --quiet; then
            echo 'No firmware changes needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add firmware/waveshare-home/WaveshareHome/AppModel.h firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
            git commit -m 'Add local automation center for rc19'
            git push
          fi
      - name: Trigger validated firmware build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml --repo '${{ github.repository }}'
