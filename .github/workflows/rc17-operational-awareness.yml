name: Apply rc17 Operational Awareness

on:
  push:
    paths:
      - 'tools/rc17_operational_awareness.py'
      - '.github/workflows/rc17-operational-awareness.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply rc17 evolution
        run: python3 tools/rc17_operational_awareness.py
      - name: Validate evolution
        run: |
          grep -q '1.0.0-rc17' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -q 'screenActivity' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'screenDevices' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'refreshActivity' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'refreshDevices' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
      - name: Commit rc17 firmware
        run: |
          if git diff --quiet; then
            echo 'No firmware changes needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add firmware/waveshare-home/WaveshareHome/AppModel.h firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
            git commit -m 'Add operational awareness surfaces for rc17'
            git push
          fi
      - name: Trigger validated firmware build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml --repo '${{ github.repository }}'
