name: Fix Waveshare Home 1.0.7 OTA Redirect Handling

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Apply updater fix
        run: python3 tools/apply_waveshare_1_0_7_redirect_fix.py

      - name: Commit updater fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/waveshare-home/WaveshareHome/AppModel.h firmware/waveshare-home/WaveshareHome/Services.cpp
          git diff --cached --check
          git commit -m "Fix Waveshare OTA cross-host redirect handling in 1.0.7"
          git push
