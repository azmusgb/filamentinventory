name: Fix Waveshare Home 1.0.7 OTA Redirect Handling

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/workflows/waveshare-1-0-7-redirect-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Patch updater and bump 1.0.7
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('firmware/waveshare-home/WaveshareHome/AppModel.h')
          text = app.read_text()
          old = 'static constexpr char FW_VERSION[] = "1.0.6";'
          new = 'static constexpr char FW_VERSION[] = "1.0.7";'
          if old not in text:
              raise SystemExit('Expected 1.0.6 FW_VERSION not found')
          app.write_text(text.replace(old, new, 1))

          svc = Path('firmware/waveshare-home/WaveshareHome/Services.cpp')
          text = svc.read_text()

          old_block = r'''  WiFiClientSecure secure;
  secure.setInsecure();
  HTTPClient http;
  http.setConnectTimeout(7000);
  http.setTimeout(15000);
  http.setFollowRedirects(HTTPC_STRICT_FOLLOW_REDIRECTS);
  if (!http.begin(secure, sys.updateFirmwareUrl)) {
    strlcpy(sys.updateError, "Could not open firmware URL", sizeof(sys.updateError));
    free(image);
    sys.otaInProgress = false;
    return false;
  }
  http.addHeader("User-Agent", "WaveshareHome/1.0.1 ESP32-S3");
  int code = http.GET();
  if (code != HTTP_CODE_OK) {
    String e = String("Firmware HTTP ") + code;
    strlcpy(sys.updateError, e.c_str(), sizeof(sys.updateError));
    http.end();
    free(image);
    sys.otaInProgress = false;
    return false;
  }
'''

          new_block = r'''  // Resolve GitHub's cross-host release-asset redirect explicitly. Reusing
  // HTTPClient redirect handling across github.com -> release-assets.githubusercontent.com
  // produced a truncated ~1.6 KB body on real ESP32-S3 hardware. Close the first
  // TLS session completely, then open a fresh client to the signed asset URL.
  String firmwareUrl = sys.updateFirmwareUrl;
  {
    WiFiClientSecure redirectSecure;
    redirectSecure.setInsecure();
    HTTPClient redirectHttp;
    redirectHttp.setConnectTimeout(7000);
    redirectHttp.setTimeout(15000);
    redirectHttp.setFollowRedirects(HTTPC_DISABLE_FOLLOW_REDIRECTS);
    const char *redirectHeaders[] = {"Location"};
    redirectHttp.collectHeaders(redirectHeaders, 1);
    if (!redirectHttp.begin(redirectSecure, firmwareUrl)) {
      strlcpy(sys.updateError, "Could not open firmware URL", sizeof(sys.updateError));
      strlcpy(sys.otaError, sys.updateError, sizeof(sys.otaError));
      free(image);
      sys.otaInProgress = false;
      return false;
    }
    redirectHttp.addHeader("User-Agent", "WaveshareHome/1.0.7 ESP32-S3");
    const int redirectCode = redirectHttp.GET();
    if (redirectCode >= 300 && redirectCode < 400) {
      String location = redirectHttp.header("Location");
      redirectHttp.end();
      if (!location.startsWith("https://")) {
        strlcpy(sys.updateError, "Firmware redirect missing secure Location", sizeof(sys.updateError));
        strlcpy(sys.otaError, sys.updateError, sizeof(sys.otaError));
        free(image);
        sys.otaInProgress = false;
        return false;
      }
      firmwareUrl = location;
    } else if (redirectCode == HTTP_CODE_OK) {
      redirectHttp.end();
    } else {
      String e = String("Firmware redirect HTTP ") + redirectCode;
      strlcpy(sys.updateError, e.c_str(), sizeof(sys.updateError));
      strlcpy(sys.otaError, sys.updateError, sizeof(sys.otaError));
      redirectHttp.end();
      free(image);
      sys.otaInProgress = false;
      return false;
    }
  }

  WiFiClientSecure secure;
  secure.setInsecure();
  HTTPClient http;
  http.setConnectTimeout(7000);
  http.setTimeout(15000);
  http.setFollowRedirects(HTTPC_DISABLE_FOLLOW_REDIRECTS);
  const char *assetHeaders[] = {"Content-Type"};
  http.collectHeaders(assetHeaders, 1);
  if (!http.begin(secure, firmwareUrl)) {
    strlcpy(sys.updateError, "Could not open release asset URL", sizeof(sys.updateError));
    strlcpy(sys.otaError, sys.updateError, sizeof(sys.otaError));
    free(image);
    sys.otaInProgress = false;
    return false;
  }
  http.addHeader("User-Agent", "WaveshareHome/1.0.7 ESP32-S3");
  int code = http.GET();
  if (code != HTTP_CODE_OK) {
    String e = String("Firmware asset HTTP ") + code;
    strlcpy(sys.updateError, e.c_str(), sizeof(sys.updateError));
    strlcpy(sys.otaError, sys.updateError, sizeof(sys.otaError));
    http.end();
    free(image);
    sys.otaInProgress = false;
    return false;
  }
  const String contentType = http.header("Content-Type");
  if (contentType.length() && contentType.indexOf("application/octet-stream") < 0) {
    String e = String("Unexpected firmware Content-Type: ") + contentType;
    strlcpy(sys.updateError, e.c_str(), sizeof(sys.updateError));
    strlcpy(sys.otaError, sys.updateError, sizeof(sys.otaError));
    http.end();
    free(image);
    sys.otaInProgress = false;
    return false;
  }
'''

          if old_block not in text:
              raise SystemExit('Expected OTA HTTP block not found')
          text = text.replace(old_block, new_block, 1)

          old_fail = r'''    free(image);
    sys.otaInProgress = false;
    sys.otaReadyToReboot = false;
    strlcpy(sys.updateStatus, "Install failed", sizeof(sys.updateStatus));
    strlcpy(sys.otaStatus, "Failed", sizeof(sys.otaStatus));
    return false;
  }

  strlcpy(sys.otaStatus, "Writing", sizeof(sys.otaStatus));
'''
          new_fail = r'''    strlcpy(sys.otaError, sys.updateError, sizeof(sys.otaError));
    free(image);
    sys.otaInProgress = false;
    sys.otaReadyToReboot = false;
    strlcpy(sys.updateStatus, "Install failed", sizeof(sys.updateStatus));
    strlcpy(sys.otaStatus, "Failed", sizeof(sys.otaStatus));
    return false;
  }

  if (sys.updateSize == 0 || image[0] != 0xE9) {
    strlcpy(sys.updateError, "Downloaded file is not an ESP application image", sizeof(sys.updateError));
    strlcpy(sys.otaError, sys.updateError, sizeof(sys.otaError));
    free(image);
    sys.otaInProgress = false;
    sys.otaReadyToReboot = false;
    strlcpy(sys.updateStatus, "Install failed", sizeof(sys.updateStatus));
    strlcpy(sys.otaStatus, "Failed", sizeof(sys.otaStatus));
    return false;
  }

  strlcpy(sys.otaStatus, "Writing", sizeof(sys.otaStatus));
'''
          if old_fail not in text:
              raise SystemExit('Expected OTA validation failure block not found')
          text = text.replace(old_fail, new_fail, 1)

          svc.write_text(text)
          PY

      - name: Commit updater fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/waveshare-home/WaveshareHome/AppModel.h firmware/waveshare-home/WaveshareHome/Services.cpp
          git diff --cached --check
          git commit -m "Fix Waveshare OTA cross-host redirect handling in 1.0.7"
          git push
