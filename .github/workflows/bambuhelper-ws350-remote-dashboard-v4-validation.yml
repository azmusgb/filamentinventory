name: BambuHelper ws_lcd_350 remote dashboard v4 validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bambuhelper-ws350-remote-dashboard-v4-validation.yml'
      - '.bambuhelper-validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Patch, optimize, and build WS350 v4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4

      - name: Checkout pinned BambuHelper source
        uses: actions/checkout@v4
        with:
          repository: Keralots/BambuHelper
          ref: 8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rehydrate evolution patchers
        shell: bash
        run: |
          set -euo pipefail
          v1=https://raw.githubusercontent.com/azmusgb/filamentinventory/741a6f0651fb4e20d8e2674f2c0ce726b0d7bdf9/.bambuhelper-validation
          v3=https://raw.githubusercontent.com/azmusgb/filamentinventory/07ce909fa7dd485abfc556eaf9addfbbd82e3cb3/.bambuhelper-validation
          curl -fsSL "$v1/installer.zlib.b64" -o /tmp/installer.b64
          for n in 0 1 2 3; do curl -fsSL "$v1/device.part$n" -o "/tmp/device.part$n"; done
          cat /tmp/device.part{0,1,2,3} > /tmp/device.b64
          curl -fsSL "$v3/v2.zlib.b64" -o /tmp/v2.b64
          curl -fsSL "$v3/v3.zlib.b64" -o /tmp/v3.b64
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          pairs=[
            ('/tmp/installer.b64','apply_installer_evolution.py'),
            ('/tmp/device.b64','apply_device_onboarding_evolution.py'),
            ('/tmp/v2.b64','apply_resilience_evolution_v2.py'),
            ('/tmp/v3.b64','apply_smart_profiles_evolution_v3.py'),
            ('.bambuhelper-validation/v4.zlib.b64','apply_ws350_remote_dashboard_v4.py'),
          ]
          for src,dst in pairs:
            raw=zlib.decompress(base64.b64decode(Path(src).read_text().strip()))
            Path(dst).write_bytes(raw)
            print(dst, len(raw))
          PY

      - name: Repair v3 duplicate-anchor patcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apply_smart_profiles_evolution_v3.py')
          text=p.read_text(encoding='utf-8')
          needle='"app/profile-account-selection",'
          pos=text.find(needle)
          start=text.rfind('    text = replace_once(',0,pos)
          end=text.find('\n    )',pos)
          if min(pos,start,end) < 0:
            raise SystemExit('v3 repair anchor not found')
          end += len('\n    )')
          replacement="""    profile_refresh_anchor = '''  updatePrinterOnboarding();
            refreshPrinterHealth(false);'''
              profile_refresh_count = text.count(profile_refresh_anchor)
              if profile_refresh_count < 1:
                  raise PatchError(
                      "app/profile-context-refresh: expected at least one v2 refresh anchor"
                  )
              text = text.replace(
                  profile_refresh_anchor,
                  '''  updatePrinterOnboarding();
            refreshGaugeProfileUi();
            refreshPrinterHealth(false);''',
              )"""
          p.write_text(text[:start]+replacement+text[end:],encoding='utf-8')
          PY
          python -m py_compile apply_*evolution*.py

      - name: Apply evolution stack
        shell: bash
        run: |
          set -euo pipefail
          python apply_installer_evolution.py --repo upstream --apply
          python apply_device_onboarding_evolution.py --repo upstream --apply
          python apply_resilience_evolution_v2.py --repo upstream --apply
          python apply_smart_profiles_evolution_v3.py --repo upstream --apply
          python apply_ws350_remote_dashboard_v4.py --repo upstream --apply

      - name: Static integration checks
        shell: bash
        run: |
          set -euo pipefail
          node --check upstream/docs/flasher.js
          node --check upstream/web/app.js
          grep -Fq 'BOARD_IS_WS350=1' upstream/boards/ws_lcd_350.ini
          grep -Fq 'DISPLAY_320x480=1' upstream/boards/ws_lcd_350.ini
          grep -Fq 'USE_FT6336=1' upstream/boards/ws_lcd_350.ini
          grep -Fq 'Remote monitor profile' upstream/include/web_pages.h
          grep -Fq 'X2D dual-nozzle' upstream/include/web_pages.h
          grep -Fq 'BambuHelper WS350 remote dashboard evolution v4' upstream/include/layout_320x480.h
          grep -Fq '#define LY_GAUGE_R 50' upstream/include/layout_320x480.h
          grep -Fq '#define LY_GAUGE_T 12' upstream/include/layout_320x480.h
          grep -Fq '#define LY_TEMP_GAUGE_T 12' upstream/include/layout_320x480.h
          grep -Fq '#define LY_AMS_BAR_H 46' upstream/include/layout_320x480.h
          grep -Fq '#define LY_LAND_ETA_H 32' upstream/include/layout_320x480.h
          grep -Fq '#define LY_GAUGE_R 48' upstream/include/layout_320x480.h
          grep -Fq '#define LY_GAUGE_T 10' upstream/include/layout_320x480.h
          grep -Fq 'ds.rotation = 1;' upstream/src/settings.cpp
          grep -Fq 'ds.timeDisplayMode = 2;' upstream/src/settings.cpp
          grep -Fq 'ds.amsTrayTypes = false;' upstream/src/settings.cpp
          grep -Fq 'ds.hmsAlertMask = 0x09;' upstream/src/settings.cpp
          grep -Fq 'ds.hmsAutoPresent = 1;' upstream/src/settings.cpp
          grep -Fq 'slots[3] = GAUGE_LAYER;' upstream/src/settings.cpp
          grep -Fq 'HMS_AUTO_PRESENT_MS = 12000' upstream/src/display_ui.h

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build WS350
        working-directory: upstream
        run: pio run -e ws_lcd_350

      - name: Build shared 320x480 regression target
        working-directory: upstream
        run: pio run -e jc3248w535

      - name: Merge fresh-install image
        working-directory: upstream
        run: python merge_bins.py --board ws_lcd_350 --full

      - name: Produce report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BambuHelper ws_lcd_350 Remote Dashboard v4 validation'
            echo '====================================================='
            echo 'upstream_commit=8cb1cbbb6d3c175af91989e8ebe1bbdcbe848ac4'
            echo 'board=ws_lcd_350'
            echo 'panel=ST7796_320x480_FT6336'
            echo 'layers=v1,v1-device,v2,v3,v4'
            echo 'default_orientation=landscape'
            echo 'time_mode=eta_plus_remaining'
            echo 'gauge_radius=50'
            echo 'gauge_thickness=12'
            echo 'ams_bar_height=46'
            echo 'visual_alerts=glow_plus_wake_no_audio'
            echo 'shared_layout_regression=jc3248w535_passed'
            echo
            find upstream/.pio/build/ws_lcd_350 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            find upstream/firmware -type f -name 'BambuHelper-ws_lcd_350-*-Full.bin' -printf '%p %s bytes\n' | sort
            echo 'SHA256:'
            find upstream/.pio/build/ws_lcd_350 upstream/firmware -type f \( -name 'firmware.bin' -o -name 'BambuHelper-ws_lcd_350-*-Full.bin' \) -print0 | sort -z | xargs -0 sha256sum
          } | tee validation-report-v4.txt

      - name: Upload validated firmware
        uses: actions/upload-artifact@v4
        with:
          name: bambuhelper-ws_lcd_350-remote-dashboard-v4
          retention-days: 7
          if-no-files-found: error
          path: |
            upstream/.pio/build/ws_lcd_350/firmware.bin
            upstream/firmware/*/BambuHelper-ws_lcd_350-*-Full.bin
            validation-report-v4.txt
