name: Apply Waveshare Home 1.3.0 Live Control Deck

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/waveshare-1-3-0-live-control-deck.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Apply live control deck
        run: python3 tools/apply_waveshare_1_3_0_live_control_deck.py

      - name: Validate live deck markers
        run: |
          grep -q 'FW_VERSION\[\] = "1.3.0"' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -q '.live-deck{' firmware/waveshare-home/web/dashboard.css
          grep -q 'function ensureDeck' firmware/waveshare-home/web/dashboard.js
          grep -q 'printerProgressBar' firmware/waveshare-home/web/dashboard.js
          grep -q 'otaProgressBar' firmware/waveshare-home/web/dashboard.js
          grep -q 'scheduleSync' firmware/waveshare-home/web/dashboard.js
          grep -q "aria-current" firmware/waveshare-home/web/dashboard.js
          grep -q 'live-deck{' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'function ensureDeck' firmware/waveshare-home/WaveshareHome/Services.cpp

      - name: Commit 1.3.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome/AppModel.h firmware/waveshare-home/WaveshareHome/Services.cpp firmware/waveshare-home/web/dashboard.css firmware/waveshare-home/web/dashboard.js
          git commit -m 'Add Live Control Deck in Waveshare Home 1.3.0'
          git push origin HEAD:main

      - name: Dispatch firmware build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run waveshare-home.yml --repo '${{ github.repository }}' --ref main
          sleep 8

      - name: Wait for validated firmware build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_SHA=$(git rev-parse HEAD)
          RUN_ID=$(gh run list --repo '${{ github.repository }}' --workflow waveshare-home.yml --event workflow_dispatch --limit 10 --json databaseId,status,headSha --jq --arg sha "$EXPECTED_SHA" 'map(select(.headSha == $sha))[0].databaseId')
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --repo '${{ github.repository }}' --exit-status
          echo "$RUN_ID" > /tmp/build_run_id

      - name: Verify 1.3.0 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(cat /tmp/build_run_id)
          NAME=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[0].name')
          test "$NAME" = 'WaveshareHome-ESP32S3-1.3.0-fullflash'
          echo "Validated artifact: $NAME"

      - name: Dispatch release publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run waveshare-release.yml --repo '${{ github.repository }}' --ref main
