name: Apply rc14 Bambu Discovery Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/rc14_bambu_discovery_fix.py'
      - '.github/workflows/rc14-bambu-discovery-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply rc14 Bambu discovery hardening
        run: python3 tools/rc14_bambu_discovery_fix.py

      - name: Validate generated source
        run: |
          grep -q 'FW_VERSION\[\].*1.0.0-rc14' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -q 'BAMBU_DISCOVERY_LEGACY_PORT = 1990' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'BAMBU_DISCOVERY_MS = 30000UL' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'discoveryUdpLegacy_' firmware/waveshare-home/WaveshareHome/Services.h
          grep -q 'directedBroadcast' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'void BambuPlugin::serviceDiscovery()' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -q 'bambuPlugin.serviceDiscovery()' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino

      - name: Commit firmware source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome/AppModel.h \
                  firmware/waveshare-home/WaveshareHome/Services.h \
                  firmware/waveshare-home/WaveshareHome/Services.cpp \
                  firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          git commit -m 'Harden Bambu LAN discovery for rc14'
          git push origin HEAD:main

      - name: Trigger firmware validation build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml --repo '${{ github.repository }}' --ref main
