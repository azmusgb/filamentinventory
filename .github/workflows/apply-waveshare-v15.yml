name: Apply Waveshare v1.5 Evolution

on:
  push:
    branches:
      - waveshare-v1.5-polish
    paths:
      - '.github/workflows/apply-waveshare-v15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: waveshare-v1.5-polish
          fetch-depth: 0

      - name: Narrow the RSSI migration assertion
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/waveshare-v15/evolve_v15.py')
          s = p.read_text()
          start = s.index('# Offline RSSI:')
          end = s.index('write(SERVICES, services)', start)
          replacement = '''# Offline RSSI: do not call a disconnected device with RSSI=0 excellent.\nservices = replace_once(services, "const sig=signal(rssi);", "const sig=d.network?.connected?signal(rssi):'Offline';", 'offline RSSI')\n'''
          p.write_text(s[:start] + replacement + s[end:])

      - name: Apply asserted v1.5 transformations
        run: python .github/waveshare-v15/evolve_v15.py

      - name: Validate source and UX contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --test tests/waveshare-ux-source.test.mjs
          node scripts/validate.mjs
          node scripts/css-audit.mjs
          grep -q 'FW_VERSION\[\].*"1.5.0"' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -q 'CONFIG_SCHEMA_VERSION = 5' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -q 'refreshActiveScreen' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q 'AirMode::PostPrint' firmware/waveshare-home/WaveshareHome/Workshop.cpp
          grep -q 'doc\["printer"\]\["printing"\]' firmware/waveshare-home/WaveshareHome/Services.cpp

      - name: Remove temporary migration machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/waveshare-v15
          rm -f .github/workflows/apply-waveshare-v15.yml
          git diff --check

      - name: Commit real v1.5 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Evolve Waveshare Home UX and runtime to v1.5.0'
          git push origin HEAD:waveshare-v1.5-polish
