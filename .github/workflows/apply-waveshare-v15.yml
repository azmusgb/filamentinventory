name: Apply Waveshare v1.5 Source Patch

on:
  push:
    branches:
      - waveshare-v1.5-polish
    paths:
      - '.github/workflows/apply-waveshare-v15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: waveshare-v1.5-polish
          fetch-depth: 0

      - name: Reconstruct v1.5 patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/waveshare-v15/patch.part00
          cat .github/waveshare-v15/patch.part* | tr -d '\r\n' | base64 --decode | gzip -dc > /tmp/waveshare-v1.5.patch
          test -s /tmp/waveshare-v1.5.patch
          echo "Patch bytes: $(wc -c < /tmp/waveshare-v1.5.patch)"
          head -n 20 /tmp/waveshare-v1.5.patch

      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/waveshare-v1.5.patch
          git apply /tmp/waveshare-v1.5.patch
          git diff --check

      - name: Run Waveshare UX regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/waveshare-ux-source.test.mjs

      - name: Validate deployment contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate.mjs
          node scripts/css-audit.mjs

      - name: Verify v1.5 firmware markers
        shell: bash
        run: |
          set -euo pipefail
          grep -R '1\.5\.0' firmware/waveshare-home/WaveshareHome firmware/waveshare-home/README.md
          grep -q 'refreshModes' firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
          grep -q '"printing"' firmware/waveshare-home/WaveshareHome/Services.cpp

      - name: Remove staging machinery
        shell: bash
        run: |
          rm -rf .github/waveshare-v15
          rm -f .github/workflows/apply-waveshare-v15.yml
          git diff --check

      - name: Commit real v1.5 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Evolve Waveshare Home UX and runtime to v1.5.0'
          git push origin HEAD:waveshare-v1.5-polish
