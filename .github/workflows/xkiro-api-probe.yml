name: xKiro API Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe xKiro usage and free coding models
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify xKiro secret is configured
        shell: bash
        env:
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${XKIRO_API_KEY:-}" ]]; then
            echo '::error::Repository secret XKIRO_API_KEY is not configured.'
            exit 1
          fi
          echo 'XKIRO_API_KEY is configured (value intentionally hidden).'

      - name: Probe account usage
        shell: bash
        env:
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x scripts/xkiro-api-probe.sh
          ./scripts/xkiro-api-probe.sh usage

      - name: List free coding candidates
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/xkiro-api-probe.sh
          ./scripts/xkiro-api-probe.sh coding

      - name: Save public model catalog
        shell: bash
        env:
          XKIRO_PROBE_OUT_DIR: ${{ runner.temp }}/xkiro-probe
        run: |
          set -euo pipefail
          chmod +x scripts/xkiro-api-probe.sh
          ./scripts/xkiro-api-probe.sh models > "${RUNNER_TEMP}/xkiro-models.json"

      - name: Upload public model catalog
        uses: actions/upload-artifact@v4
        with:
          name: xkiro-model-catalog
          path: ${{ runner.temp }}/xkiro-models.json
          if-no-files-found: error
          retention-days: 7
