name: Promote Waveshare Home 1.0

on:
  push:
    paths:
      - 'tools/promote_waveshare_1_0.py'
      - '.github/workflows/waveshare-1-0-promote.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Promote rc21 to stable 1.0.0
        run: python3 tools/promote_waveshare_1_0.py

      - name: Validate stable version
        run: |
          grep -q 'FW_VERSION\[\].*"1.0.0"' firmware/waveshare-home/WaveshareHome/AppModel.h
          ! grep -q 'FW_VERSION\[\].*rc' firmware/waveshare-home/WaveshareHome/AppModel.h

      - name: Commit stable firmware source
        run: |
          if git diff --quiet; then
            echo 'Stable 1.0.0 source already present'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add firmware/waveshare-home/WaveshareHome/AppModel.h firmware/waveshare-home/WaveshareHome/WaveshareHome.ino
            git commit -m 'Promote Waveshare Home to stable 1.0.0'
            git push
          fi

      - name: Trigger validated firmware build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml --repo '${{ github.repository }}'
