name: Apply Waveshare Home 1.0.3 Updater Redirect Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/apply_waveshare_1_0_3_updater_redirect_fix.py'
      - '.github/workflows/waveshare-1-0-3-updater-redirect-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply 1.0.3 updater redirect fix
        run: python3 tools/apply_waveshare_1_0_3_updater_redirect_fix.py

      - name: Validate updater invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('firmware/waveshare-home/WaveshareHome/Services.cpp').read_text()
          m = Path('firmware/waveshare-home/WaveshareHome/AppModel.h').read_text()
          assert 'FW_VERSION[] = "1.0.3"' in m
          assert 'HTTPC_STRICT_FOLLOW_REDIRECTS' in s
          assert 'http.setRedirectLimit(5);' in s
          assert 'strlcpy(sys.updateStatus, "Install failed"' in s
          assert 'strlcpy(sys.otaStatus, "Failed"' in s
          start = s.index("<form method='post' action='/settings'>")
          end = s.index('</form>', start)
          assert s[start:end].count('<form') == 1
          print('Updater invariants validated')
          PY

      - name: Commit firmware changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome/Services.cpp firmware/waveshare-home/WaveshareHome/AppModel.h
          git commit -m 'Fix Waveshare Home updater redirects for 1.0.3'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger firmware build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml
