name: Bambu UDP Compatibility Fix

on:
  push:
    paths:
      - '.github/workflows/bambu-udp-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch ESP32 3.2 NetworkUDP multicast send API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('firmware/waveshare-home/WaveshareHome/Services.cpp')
          s = p.read_text()
          old = 'discoveryUdp_.beginPacketMulticast(BAMBU_DISCOVERY_GROUP, BAMBU_DISCOVERY_PORT, WiFi.localIP());'
          new = 'discoveryUdp_.beginPacket(BAMBU_DISCOVERY_GROUP, BAMBU_DISCOVERY_PORT);'
          if old not in s:
              raise SystemExit('Expected beginPacketMulticast call not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/waveshare-home/WaveshareHome/Services.cpp
          git commit -m "Fix Bambu UDP discovery on ESP32 core 3.2"
          git push
