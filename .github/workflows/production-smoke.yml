name: Production Smoke

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify production
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out expected production revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Verify exact deployment and public contract
        shell: bash
        env:
          SITE_URL: https://filamentinventory.netlify.app
        run: |
          set -euo pipefail

          expected_commit="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected_version="$(sed -n "s/.*const APP_VERSION = '\([^']*\)'.*/\1/p" app-version.js | head -n 1)"
          if [[ ! "${expected_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve the expected Git commit identity"
            exit 1
          fi
          if [[ -z "${expected_version}" ]]; then
            echo "::error::Unable to read APP_VERSION from app-version.js"
            exit 1
          fi

          cache_buster="smoke=$(date +%s)"
          deployment_identity_ok=false

          # Netlify usually finishes before CI, but allow a short propagation window.
          # Success requires both the exact Git SHA and the expected app version.
          for attempt in {1..12}; do
            deployed_meta="$(curl --silent --show-error --fail \
              --connect-timeout 10 --max-time 20 \
              "${SITE_URL}/build-meta.json?${cache_buster}" || true)"
            deployed_version="$(curl --silent --show-error --fail \
              --connect-timeout 10 --max-time 20 \
              "${SITE_URL}/app-version.js?${cache_buster}" || true)"

            deployed_commit="$(node -e "try { const m=JSON.parse(process.argv[1]); process.stdout.write(String(m.commitRef||'').toLowerCase()); } catch {}" "${deployed_meta}")"

            if [[ "${deployed_commit}" == "${expected_commit}" ]] && \
               grep -Fq "const APP_VERSION = '${expected_version}'" <<<"${deployed_version}"; then
              deployment_identity_ok=true
              break
            fi

            if [[ "${attempt}" -lt 12 ]]; then
              sleep 10
            fi
          done

          if [[ "${deployment_identity_ok}" != true ]]; then
            echo "::error::Production did not expose exact commit ${expected_commit} and app version ${expected_version} within the bounded propagation window."
            exit 1
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT

          fetch_with_headers() {
            local path="$1"
            local body_file="$2"
            local header_file="$3"
            curl --silent --show-error --fail --location \
              --connect-timeout 10 --max-time 20 \
              -D "${header_file}" -o "${body_file}" \
              "${SITE_URL}${path}?${cache_buster}"
          }

          require_header() {
            local header_file="$1"
            local pattern="$2"
            local description="$3"
            if ! grep -Eiq "${pattern}" "${header_file}"; then
              echo "::error::Missing or incorrect ${description} header"
              cat "${header_file}"
              exit 1
            fi
          }

          expect_status() {
            local expected="$1"
            local method="$2"
            local path="$3"
            shift 3
            local slug
            slug="$(tr '/?' '__' <<<"${path}" | tr -cd '[:alnum:]_-')"
            local headers="${tmp_dir}/${slug}.headers"
            local body="${tmp_dir}/${slug}.body"
            local actual
            actual="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              -X "${method}" "$@" \
              -D "${headers}" -o "${body}" -w '%{http_code}' \
              "${SITE_URL}${path}")"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error::${method} ${path} returned ${actual}; expected ${expected}"
              cat "${headers}"
              cat "${body}"
              exit 1
            fi
            require_header "${headers}" '^cache-control:[[:space:]]*no-store' "${path} Cache-Control"
          }

          fetch_with_headers "/" "${tmp_dir}/index.html" "${tmp_dir}/index.headers"
          require_header "${tmp_dir}/index.headers" '^x-content-type-options:[[:space:]]*nosniff' 'X-Content-Type-Options'
          require_header "${tmp_dir}/index.headers" '^x-robots-tag:[[:space:]]*noindex, nofollow, noarchive' 'X-Robots-Tag'
          require_header "${tmp_dir}/index.headers" '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' 'Referrer-Policy'
          require_header "${tmp_dir}/index.headers" "^content-security-policy:.*frame-ancestors 'none'" 'Content-Security-Policy frame-ancestors'

          for asset in \
            app.js \
            app-version.js \
            build-meta.json \
            ui-system.css \
            manifest.webmanifest \
            sw.js \
            bulk-actions-core.js \
            bulk-actions-client.js; do
            curl --silent --show-error --fail --location \
              --connect-timeout 10 --max-time 20 \
              -o /dev/null "${SITE_URL}/${asset}?${cache_buster}"
          done

          fetch_with_headers "/build-meta.json" "${tmp_dir}/build-meta.json" "${tmp_dir}/build-meta.headers"
          require_header "${tmp_dir}/build-meta.headers" '^cache-control:.*no-cache.*no-store.*must-revalidate' 'build metadata cache-control'

          fetch_with_headers "/app-version.js" "${tmp_dir}/version.js" "${tmp_dir}/version.headers"
          require_header "${tmp_dir}/version.headers" '^cache-control:.*max-age=0.*must-revalidate' 'app-version cache-control'

          fetch_with_headers "/sw.js" "${tmp_dir}/sw.js" "${tmp_dir}/sw.headers"
          require_header "${tmp_dir}/sw.headers" '^cache-control:.*no-cache.*no-store.*must-revalidate' 'service-worker cache-control'

          fetch_with_headers "/manifest.webmanifest" "${tmp_dir}/manifest.json" "${tmp_dir}/manifest.headers"
          require_header "${tmp_dir}/manifest.headers" '^content-type:[[:space:]]*application/manifest\+json' 'manifest Content-Type'

          # Security boundary probes use no real sync key and must fail closed.
          expect_status 401 GET "/api/sync"
          expect_status 401 POST "/api/sync-admin" \
            -H 'Content-Type: application/json' \
            --data '{}'
          expect_status 400 GET "/api/sync" \
            -H 'X-Filament-Sync-Key: 00000000000000000000000000000000' \
            -H 'X-Filament-Profile: Invalid'

          echo "Production smoke passed for exact commit ${expected_commit} at app version ${expected_version}."
