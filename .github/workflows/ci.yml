name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Apply bulk spool operations once
        if: github.event_name == 'pull_request'
        run: |
          if grep -q "const APP_VERSION = '9.9.0';" app-version.js; then
            echo "Bulk spool integration already applied."
          else
            node scripts/apply-bulk-actions-integration.mjs
            git add -A
            git restore --staged .github/workflows/ci.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat: wire bulk spool operations"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Static validation
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify deploy output
        run: |
          test -f dist/index.html
          test -f dist/ui-system.css
          test -f dist/app-version.js
          test -f dist/user-isolation.js
          test -f dist/intake-core.js
          test -f dist/intake-client.js
          test -f dist/scan-core.js
          test -f dist/scan-client.js
          test -f dist/printer-core.js
          test -f dist/printer-dashboard.js
          test -f dist/inventory-command-core.js
          test -f dist/inventory-command-client.js
          test -f dist/spool-actions-core.js
          test -f dist/spool-actions-client.js
          test -f dist/app.js
          test -f dist/audit-core.js
          test -f dist/audit-client.js
          test -f dist/personal-core.js
          test -f dist/personal-dashboard.js
          test -f dist/sw.js
          test ! -e dist/package.json
          test ! -e dist/netlify.toml
          test ! -e dist/netlify

      - name: Upload deploy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filamentinventory-dist-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 7
