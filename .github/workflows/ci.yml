name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Static validation
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify deploy output
        run: |
          test -f dist/index.html
          test -f dist/ui-polish.css
          test -f dist/app-version.js
          test -f dist/user-isolation.js
          test -f dist/intake-core.js
          test -f dist/intake-client.js
          test -f dist/scan-core.js
          test -f dist/scan-client.js
          test -f dist/printer-core.js
          test -f dist/printer-dashboard.js
          test -f dist/app.js
          test -f dist/audit-core.js
          test -f dist/audit-client.js
          test -f dist/personal-core.js
          test -f dist/personal-dashboard.js
          test -f dist/sw.js
          test ! -e dist/package.json
          test ! -e dist/netlify.toml
          test ! -e dist/netlify

      - name: Upload deploy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filamentinventory-dist-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 7
