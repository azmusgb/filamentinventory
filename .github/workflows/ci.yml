name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply household sync integrity patch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          node scripts/apply-household-sync-integrity.mjs
          if git diff --quiet -- household-client.js netlify/functions/sync.mts; then
            echo "Integrity patch already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add household-client.js netlify/functions/sync.mts
            git commit -m "fix: preserve household placement changes across sync"
            git push origin HEAD:"${HEAD_BRANCH}"
          fi

      - name: Static validation
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify deploy output
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/sw.js
          test ! -e dist/package.json
          test ! -e dist/netlify.toml
          test ! -e dist/netlify

      - name: Upload deploy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filamentinventory-dist-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 7
