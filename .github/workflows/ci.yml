name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Static validation
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify deploy output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/ui-system.css
          test -f dist/app-version.js
          test -f dist/build-meta.json
          test -f dist/user-isolation.js
          test -f dist/intake-core.js
          test -f dist/intake-client.js
          test -f dist/scan-core.js
          test -f dist/scan-client.js
          test -f dist/printer-core.js
          test -f dist/printer-dashboard.js
          test -f dist/inventory-command-core.js
          test -f dist/inventory-command-client.js
          test -f dist/spool-actions-core.js
          test -f dist/spool-actions-client.js
          test -f dist/bulk-actions-core.js
          test -f dist/bulk-actions-client.js
          test -f dist/app.js
          test -f dist/audit-core.js
          test -f dist/audit-client.js
          test -f dist/personal-core.js
          test -f dist/personal-dashboard.js
          test -f dist/sw.js
          test ! -e dist/package.json
          test ! -e dist/netlify.toml
          test ! -e dist/netlify

          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';

          const meta = JSON.parse(readFileSync('dist/build-meta.json', 'utf8'));
          const expected = String(process.env.GITHUB_SHA || '').toLowerCase();
          if (!/^[0-9a-f]{40}$/.test(expected)) {
            throw new Error(`CI did not expose a valid GITHUB_SHA: ${expected || '(empty)'}`);
          }
          if (meta.schema !== 1) {
            throw new Error(`Unexpected build metadata schema: ${meta.schema}`);
          }
          if (meta.commitRef !== expected) {
            throw new Error(`Build metadata commit mismatch: expected ${expected}, received ${meta.commitRef}`);
          }
          if (meta.provider !== 'github-actions') {
            throw new Error(`Expected GitHub Actions build provider, received ${meta.provider}`);
          }
          console.log(`Verified exact build identity ${meta.commitRef}.`);
          NODE

      - name: Upload deploy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filamentinventory-dist-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 7
