name: Fix Waveshare Home 1.0.5 OTA Size Validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/waveshare-1-0-5-ota-size-fix.yml'
      - 'tools/apply_waveshare_1_0_5_ota_size_fix.py'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply updater fix
        run: python3 tools/apply_waveshare_1_0_5_ota_size_fix.py

      - name: Validate updater fix
        run: |
          grep -F 'FW_VERSION[] = "1.0.5"' firmware/waveshare-home/WaveshareHome/AppModel.h
          grep -F 'OTA transport Content-Length' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -F 'Firmware byte count mismatch' firmware/waveshare-home/WaveshareHome/Services.cpp
          grep -F 'setFollowRedirects(HTTPC_STRICT_FOLLOW_REDIRECTS)' firmware/waveshare-home/WaveshareHome/Services.cpp

      - name: Commit updater fix
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/waveshare-home/WaveshareHome/AppModel.h firmware/waveshare-home/WaveshareHome/Services.cpp
          git commit -m 'Fix Waveshare OTA Content-Length validation in 1.0.5'
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger firmware build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run waveshare-home.yml
