# Filament Inventory was retired on 24 Oct 2026 (spools now live in Bambuddy on the Pi).
# The site serves only a notice. Every API is gone, and the old service worker is replaced so it uninstalls.
# The app's source stays in this repository for history; the previous configuration is in git history.
[build]
  command = "true"
  publish = "retired"
  functions = "retired/no-functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/api/*"
  to = "/gone.json"
  status = 410
  force = true

[[redirects]]
  from = "/qr"
  to = "/gone.json"
  status = 410
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
